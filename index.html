    '<h1 class="tt">'+(FOCUS?scopeName+' 🎯':'Marketing Management — Quiz II 🧠')+'</h1>'+
    '<div class="sub">'+(FOCUS
      ? 'Just this section — <b>'+ACTIVE.length+' cases</b>. Use the sidebar to switch sections, or hit <b>All sections</b> to sit the full paper.'
      : '<b>'+ACTIVE.length+' cases</b> across <b>four sections</b>, covering the ground after Quiz I: <b>Sessions 8–12</b> — brand and the 6P mix, '+
        'proposition, product levels and price, the product mix, and pack-price architecture. '+
        'Click any section in the sidebar to practise just that block.')+'</div>'+
    '<div class="sub" style="margin-top:10px">Every question is a <b>case</b>, not a definition. A decision is on the table, or a colleague has just said something confident and wrong, '+
    'and you have to say what is actually going on — the same shape as the Quiz I paper. '+
    'The brands are <b>invented</b> — <b>Lather</b>, a challenger shampoo, with rivals <b>Silk</b> and <b>Purely</b>; and <b>CrunchLab</b>, a protein-bar startup — '+
    'so nothing turns on what you happen to know about the real market. The frameworks carry every answer.</div>'+
    '<div class="sub" style="margin-top:10px">Pitched <b>low to moderate</b>. The four numerical cases (RPI, price per ml, the price ladder, pack margins) use only arithmetic the decks '+
    'work through on a slide — no formula here is one you have not already seen.</div>'+
    '<div class="sub" style="margin-top:10px">Instant feedback with the full reasoning in the <b>Why</b> panel — that panel is the revision, not the score. '+
    'It always works the wrong options too, because on a case paper the distractor is usually the thing a real team would have said in the meeting. '+
    'Options reshuffle every attempt, so the answer is never always “A”. '+
    'Watch for the <span class="tag trap" style="margin:0">🃏 tricky</span> tag — those '+TRAPS+' cases turn on a distinction that is easy to get backwards '+
    '(a discount is not a proposition · price per ml, not per pack · a blind test proves features, not performance · a wedding is not an Experiential mission · '+
    'a cheap small pack recruits your own buyers downward).</div>'+
    '<div class="sub" style="margin-top:10px">Stuck? Hit <b>📋 mix</b> in the header for the cheat-sheet — the 6Ps with Surf excel filled in, the four product levels, the RPI formula and every pack-price rule. '+
    'Answer with the mouse or press <b>1–4</b> / <b>A–D</b>. Get it right and the crackers go off 🎆 — '+
    'and they escalate: <b>3 in a row</b> adds shells and confetti, <b>7</b> adds a screen flash, <b>12</b> triggers the full barrage. '+
    'Get it wrong and, well… you will hear about it. 🔊 Mute from the header any time.</div>'+
    '<div class="srcrow">'+TOPICS.map(t=>'<span class="src">'+t.name+'</span>').join('')+'</div>';
  m.appendChild(intro);
  let n=0;
  TOPICS.forEach((t,ti)=>{
    const qs=ACTIVE.filter(q=>q.t===t.id);if(!qs.length)return;
    const h=el('div','qgroup-h');h.id='grp-'+t.id;
    h.innerHTML='<span class="gi">'+String(ti+1).padStart(2,'0')+'</span><span class="gt">'+t.name+(t.hot?' 🔥':'')+'</span><span class="gc">'+qs.length+' cases</span>';
    m.appendChild(h);
    qs.forEach(q=>{n++;
      const card=el('div','qcard');
      card.appendChild(el('div','qnum','<span>Q'+n+' / '+ACTIVE.length+'</span>'));
      card.appendChild(mcqNode(q,card,ok=>{
        quizState.answered++;quizState.per[q.t].a++;
        if(ok){quizState.correct++;quizState.per[q.t].c++;if(q.trap)quizState.traps++;}
        else quizState.missed.push(q);
        const p=quizState.per[q.t];
        if(p.a===p.n&&p.c===p.n){const map={brand:'b_brand',mix:'b_mix',pmix:'b_pmix',pack:'b_pack'};if(map[q.t])unlock(map[q.t]);}
        if(quizState.traps===TRAPS)unlock('b_trap');
        buildSidebar();updateFoot();}));
      m.appendChild(card);});
  });
  const rc=el('div','card hidden');rc.id='resultsCard';m.appendChild(rc);
  buildFoot();buildSidebar();
}
function buildFoot(){
  let f=$('#footbar');if(f)f.remove();
  f=el('div','footbar');f.id='footbar';
  f.innerHTML='<div class="fp"><span class="lbl" id="footLbl">0 / '+QUIZ.length+' answered · 0 correct</span><div class="bar"><i id="footBar"></i></div></div>';
  const btn=el('button','btn btn-grad','See Results ↓');btn.id='footBtn';btn.style.opacity=.5;btn.style.pointerEvents='none';btn.onclick=showResults;
  const rt=el('button','btn btn-ghost','↺ Reshuffle &amp; Retake');
  rt.onclick=()=>{renderQuiz();window.scrollTo({top:0,behavior:reduced?'auto':'smooth'});};
  f.appendChild(btn);f.appendChild(rt);document.body.appendChild(f);
}
function updateFoot(){
  const{answered,correct,total}=quizState;
  $('#footLbl').textContent=answered+' / '+total+' answered · '+correct+' correct'+(G.best?' · best streak '+G.best:'');
  $('#footBar').style.width=(answered/total*100)+'%';
  const btn=$('#footBtn');if(answered===total){btn.style.opacity=1;btn.style.pointerEvents='auto';}
}
function grade(p){
  if(p>=90)return['Outstanding — exam-ready! 🏆','var(--lime)'];
  if(p>=75)return['Strong pass — polish the weak spots. ✅','var(--cyan)'];
  if(p>=60)return['Decent — a focused review will lift this. 📈','var(--gold)'];
  return['Keep going — reread the Why panels and retake. 🔁','var(--red)'];
}
function showResults(){
  const{correct,total,per}=quizState,pct=Math.round(correct/total*100);
  MISSED=quizState.missed.slice();
  if(pct>=75)unlock('b_quiz75'); if(pct===100)unlock('b_perfect');
  const rc=$('#resultsCard');rc.className='card';rc.innerHTML='';
  rc.appendChild(el('div',null,'<div class="eyebrow">Results</div><h1 class="tt">Quiz complete</h1>'));
  const R=80,C=2*Math.PI*R;const rw=el('div','ring-wrap');
  rw.innerHTML='<div class="ring"><svg width="200" height="200" viewBox="0 0 200 200">'+
    '<circle cx="100" cy="100" r="'+R+'" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="16"/>'+
    '<circle id="ringArc" cx="100" cy="100" r="'+R+'" fill="none" stroke="url(#gg)" stroke-width="16" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+C+'"/>'+
    '<defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="0.5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#F472B6"/></linearGradient></defs></svg>'+
    '<div class="mid"><div class="big" id="ringPct">0%</div><div class="sm">'+correct+' / '+total+'</div></div></div>';
  const g=grade(pct),gs=el('div');
  gs.innerHTML='<div class="grade" style="color:'+g[1]+'">'+g[0]+'</div><div class="sub">You answered '+correct+' of '+total+' correctly · longest streak <b>'+G.best+'</b> · tricky questions cleared <b>'+quizState.traps+' / '+TRAPS+'</b>.</div>';
  rw.appendChild(gs);rc.appendChild(rw);
  const meters=el('div','meters');let weak=null;
  TOPICS.forEach(t=>{const p=per[t.id];if(!p.n)return;const r=p.c/p.n;
    if(weak===null||r<weak.r)weak={id:t.id,name:t.name,r};
    const mt=el('div','meter');
    mt.innerHTML='<div class="top"><span>'+t.name+'</span><span class="sc">'+p.c+'/'+p.n+'</span></div><div class="bar"><i data-w="'+(r*100)+'"></i></div>';
    meters.appendChild(mt);});
  rc.appendChild(meters);
  if(weak&&weak.r<1){
    const w=el('div','watch');
    w.innerHTML='<h5>Weakest section: '+weak.name+'</h5><p style="color:#ffd9e0">Reread the Why panels in that block — they carry the full working. <a style="color:var(--cyan);cursor:pointer" id="goWeak">Practise just this section →</a></p>';
    rc.appendChild(w);}
  const row=el('div','row-btns');
  if(MISSED.length){
    const dr=el('button','btn btn-grad','🎯 Drill the '+MISSED.length+' I missed');
    dr.onclick=()=>setScope('missed');
    row.appendChild(dr);
  }
  const rt=el('button','btn '+(MISSED.length?'btn-ghost':'btn-grad'),'↺ Reshuffle &amp; Retake');
  rt.onclick=()=>{renderQuiz();window.scrollTo({top:0,behavior:reduced?'auto':'smooth'});};
  row.appendChild(rt);
  if(FOCUS||ACTIVE.length!==QUIZ.length){
    const fa=el('button','btn btn-ghost','◎ Sit the full paper');
    fa.onclick=()=>setScope('all');
    row.appendChild(fa);
  }
  rc.appendChild(row);
  rc.scrollIntoView({behavior:reduced?'auto':'smooth',block:'start'});
  requestAnimationFrame(()=>{
    const arc=$('#ringArc');arc.style.transition=reduced?'none':'stroke-dashoffset 1.1s var(--spring)';
    arc.style.strokeDashoffset=C*(1-pct/100);
    meters.querySelectorAll('.bar i').forEach((b,i)=>setTimeout(()=>b.style.width=b.dataset.w+'%',reduced?0:120+i*80));
    const node=$('#ringPct');
    if(reduced)node.textContent=pct+'%';
    else{const t0=performance.now();(function tk(now){const p=Math.min(1,(now-t0)/1100);node.textContent=Math.round(pct*p)+'%';if(p<1)requestAnimationFrame(tk);})(t0);}
  });
  const wb=$('#goWeak');
  if(wb)wb.onclick=()=>setScope('topic',weak.id);
  if(pct>=75){sfxFanfare();confetti(140);crackers(innerWidth*0.5,innerHeight*0.38,14);mega(pct===100?'👑':'🎉',true);bigCall(pct===100?'FLAWLESS! 👑':'WELL PLAYED! 🎉');}
  else{sfxSad();mega('😬',false);}
}

/* ---------- badges panel ---------- */
/* opens over the quiz so an attempt in progress is never lost */
$('#hBadge').onclick=()=>{
  if($('#badgeOvl')||$('#cmapOvl'))return;
  const ovl=el('div','ovl');ovl.id='badgeOvl';
  const card=el('div','card');
  card.innerHTML='<div class="eyebrow">Achievements</div><h1 class="tt">Your badges — '+Object.keys(G.badges).length+' / '+BADGES.length+'</h1>'+
    '<div class="sub">Earned by clearing sections, dodging the tricky questions, running streaks and scoring high on a full attempt.</div>';
  const grid=el('div','badgegrid');
  BADGES.forEach(b=>{const c=el('div','bcard'+(G.badges[b.id]?' unlocked':''));
    c.innerHTML='<div class="em">'+(G.badges[b.id]?b.em:'🔒')+'</div><div class="bn">'+b.name+'</div><div class="bd">'+b.desc+'</div>';
    grid.appendChild(c);});
  card.appendChild(grid);
  const row=el('div','row-btns');
  const bk=el('button','btn btn-grad','← Back to the quiz');
  const close=()=>ovl.remove();
  bk.onclick=close;row.appendChild(bk);card.appendChild(row);
  const x=el('button','x','×');x.onclick=close;
  ovl.appendChild(x);ovl.appendChild(card);
  ovl.onclick=e=>{if(e.target===ovl)close();};
  document.addEventListener('keydown',function esc(e){if(e.key==='Escape'){close();document.removeEventListener('keydown',esc);}});
  document.body.appendChild(ovl);
};

/* ---------- mix map (cheat-sheet) ---------- */
/* Opens over the quiz, like the badges panel, so an attempt in progress survives. */
$('#hMap').onclick=()=>{
  if($('#cmapOvl'))return;
  const ovl=el('div','ovl');ovl.id='cmapOvl';
  const card=el('div','card');
  card.innerHTML='<div class="eyebrow">Reference</div><h1 class="tt">The Mix Map 📋</h1>'+
    '<div class="sub">Sessions 8–12 on one page — the 6Ps with Surf excel filled in, the four levels of Product, the RPI formula, '+
    'the quality parameters, and every pack-price rule. <b>Bold</b> marks the bit that usually carries the mark.</div>';
  CMAP.forEach(b=>{
    const blk=el('div','cm-block');
    blk.innerHTML='<h4>'+b.h+'</h4><p class="cm-note">'+b.note+'</p>';
    const sc=el('div','cm-scroll');
    /* rows carry a variable number of cells; the last cell of a short row
       spans the remainder so the columns stay aligned down the block */
    const cells=b.rows.map(r=>r.filter(c=>c!=='')), cols=Math.max(...cells.map(r=>r.length));
    sc.innerHTML='<table><tbody>'+cells.map(r=>
      '<tr>'+r.map((c,i)=>{
        const span=(i===r.length-1&&r.length<cols)?' colspan="'+(cols-i)+'"':'';
        return '<td'+span+'>'+c+'</td>';
      }).join('')+'</tr>').join('')+'</tbody></table>';
    blk.appendChild(sc);card.appendChild(blk);
  });
  const row=el('div','row-btns');
  const bk=el('button','btn btn-grad','← Back to the quiz');
  const close=()=>ovl.remove();
  bk.onclick=close;row.appendChild(bk);card.appendChild(row);
  const x=el('button','x','×');x.onclick=close;
  ovl.appendChild(x);ovl.appendChild(card);
  ovl.onclick=e=>{if(e.target===ovl)close();};
  document.addEventListener('keydown',function esc(e){if(e.key==='Escape'){close();document.removeEventListener('keydown',esc);}});
  document.body.appendChild(ovl);
};

/* ---------- init ---------- */
renderHUD();renderQuiz();
</script>
