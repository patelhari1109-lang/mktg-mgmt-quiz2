<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketing Management · Quiz II</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070B1A; --cyan:#22D3EE; --violet:#8B5CF6; --pink:#F472B6;
  --lime:#4ADE80; --red:#FB7185; --gold:#FBBF24;
  --grad:linear-gradient(100deg,#22D3EE,#8B5CF6,#F472B6);
  --glass:rgba(255,255,255,.05); --glass-brd:rgba(255,255,255,.12);
  --ink:#E7ECFF; --muted:#9AA6C9; --spring:cubic-bezier(.22,1.4,.36,1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
.mono{font-family:'JetBrains Mono',monospace}
.bg-fx{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;animation:drift 26s var(--spring) infinite alternate}
.orb.a{width:520px;height:520px;background:#1e3a8a;top:-160px;left:-120px}
.orb.b{width:460px;height:460px;background:#6d28d9;bottom:-180px;right:-100px;animation-duration:32s}
.orb.c{width:380px;height:380px;background:#0e7490;top:40%;left:55%;animation-duration:29s}
.orb.d{width:300px;height:300px;background:#be185d;top:12%;right:18%;animation-duration:35s;opacity:.35}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(60px,50px) scale(1.15)}}
.grid-fx{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:linear-gradient(rgba(139,92,246,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(139,92,246,.09) 1px,transparent 1px);
  background-size:46px 46px;-webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.7),transparent 60%);mask-image:linear-gradient(to bottom,rgba(0,0,0,.7),transparent 60%)}
/* ===== header w/ game HUD ===== */
header{position:sticky;top:0;z-index:50;padding:2px;margin:12px;border-radius:20px;background:var(--grad);background-size:300% 300%;animation:flow 8s linear infinite}
@keyframes flow{to{background-position:300% 0}}
.hdr-in{background:rgba(9,13,28,.88);backdrop-filter:blur(14px);border-radius:18px;padding:12px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.1;min-width:180px}
.brand .k{font-size:11px;letter-spacing:.26em;color:var(--cyan);font-weight:600}
.brand .t{font-size:18px;font-weight:700}
.brand .s{font-size:11px;color:var(--muted)}
.hud{margin-left:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.lvl{display:flex;flex-direction:column;gap:3px;min-width:170px}
.lvl .top{display:flex;justify-content:space-between;font-size:11px}
.lvl .top .ti{font-weight:700;color:#fff}
.lvl .top .xp{font-family:'JetBrains Mono',monospace;color:var(--gold)}
.lvl .bar{height:8px;border-radius:8px;background:rgba(255,255,255,.09);overflow:hidden}
.lvl .bar i{display:block;height:100%;width:0;border-radius:8px;background:var(--grad);background-size:200% 100%;animation:shim 2.5s linear infinite;transition:width .6s var(--spring)}
@keyframes shim{to{background-position:200% 0}}
.chip{display:flex;align-items:center;gap:6px;background:var(--glass);border:1px solid var(--glass-brd);border-radius:12px;padding:7px 12px;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;transition:.3s}
.chip.streak{color:var(--gold)}
.chip.streak.t1{border-color:rgba(251,191,36,.45);box-shadow:0 0 14px rgba(251,191,36,.22)}
.chip.streak.t2{border-color:rgba(251,146,60,.7);box-shadow:0 0 20px rgba(251,146,60,.38);color:#FDBA74}
.chip.streak.t3{border-color:rgba(244,114,182,.85);box-shadow:0 0 28px rgba(244,114,182,.5);color:#FBCFE8;animation:pulseHot 1.1s ease-in-out infinite alternate}
@keyframes pulseHot{to{transform:scale(1.07)}}
.chip.badge,.chip.snd{cursor:pointer}
.chip.badge{color:var(--cyan)}
.chip.snd{color:var(--pink)}
.chip.cmap{color:var(--lime);cursor:pointer}
.chip.cmap:hover{border-color:rgba(74,222,128,.6)}
.chip.snd.off{color:var(--muted);opacity:.65}
.chip .lab{font-size:10px;letter-spacing:.12em;color:var(--muted);font-family:'Space Grotesk',sans-serif;font-weight:600}
/* ===== layout ===== */
.wrap{display:grid;grid-template-columns:290px 1fr;gap:20px;padding:6px 18px 96px;max-width:1320px;margin:0 auto}
aside{position:sticky;top:104px;align-self:start;max-height:calc(100vh - 124px);overflow-y:auto;padding-right:4px}
aside::-webkit-scrollbar{width:6px}aside::-webkit-scrollbar-thumb{background:rgba(139,92,246,.4);border-radius:6px}
.side-h{font-size:11px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin:4px 0 10px 6px}
.pbar{height:8px;border-radius:8px;background:rgba(255,255,255,.07);overflow:hidden;margin:0 6px 16px}
.pbar i{display:block;height:100%;width:0;border-radius:8px;background:var(--grad);background-size:200% 100%;animation:shim 2.5s linear infinite;transition:width .6s var(--spring)}
.topic{display:flex;align-items:center;gap:10px;padding:11px 12px;margin-bottom:7px;border-radius:13px;background:var(--glass);border:1px solid transparent;cursor:pointer;transition:.25s;font-size:13.5px}
.topic:hover{border-color:var(--glass-brd);transform:translateX(3px)}
.topic .idx{width:24px;height:24px;flex:0 0 24px;border-radius:8px;display:grid;place-items:center;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;background:rgba(255,255,255,.08);color:var(--muted)}
.topic.done .idx{background:var(--grad);color:#08111f}
.topic .nm{flex:1;line-height:1.2;display:flex;flex-direction:column;gap:2px;min-width:0}
.topic .nm small{font-size:10.5px;color:var(--muted);font-family:'JetBrains Mono',monospace}
.topic .flame{font-style:normal;font-size:12px}
.topic .sc{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--cyan)}
.topic.done{border-color:rgba(74,222,128,.34)}
.topic.hot{border-color:rgba(251,191,36,.3)}
main{min-width:0}
.card{background:var(--glass);border:1px solid var(--glass-brd);border-radius:20px;padding:26px 28px;backdrop-filter:blur(10px);margin-bottom:18px;animation:popIn .5s var(--spring) both}
@keyframes popIn{from{opacity:0;transform:translateY(22px) scale(.96)}to{opacity:1;transform:none}}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--cyan);font-weight:600;margin-bottom:6px}
h1.tt{font-size:26px;margin:0 0 4px;font-weight:700}
.sub{color:var(--muted);font-size:14px;line-height:1.6}
.sub b{color:#D6DDF7}
.srcrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.src{font-family:'JetBrains Mono',monospace;font-size:11px;padding:5px 11px;border-radius:999px;background:rgba(139,92,246,.14);border:1px solid rgba(139,92,246,.45);color:#d6ccff}
.watch{margin-top:14px;background:rgba(251,113,133,.09);border:1px solid rgba(251,113,133,.45);border-left:4px solid var(--red);border-radius:12px;padding:14px 16px}
.watch h5{margin:0 0 4px;color:var(--red);font-size:14px} .watch p{margin:0;font-size:13.5px;color:#ffd9e0;line-height:1.5}
/* ===== buttons / mcq ===== */
.btn{border:0;font-family:inherit;font-weight:600;cursor:pointer;border-radius:12px;transition:.25s;font-size:14px}
.btn-grad{background:var(--grad);background-size:200% auto;color:#08111f;padding:12px 24px;box-shadow:0 6px 24px rgba(139,92,246,.35)}
.btn-grad:hover{background-position:100% center;transform:translateY(-2px)}
.btn-ghost{background:rgba(255,255,255,.06);border:1px solid var(--glass-brd);color:var(--ink);padding:11px 20px}
.btn-ghost:hover{border-color:var(--cyan);color:#fff}
.row-btns{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:20px}
.mcq{margin-top:8px}.mcq .q{font-size:16px;font-weight:600;margin-bottom:8px;line-height:1.5}
.mcq .q b{color:#fff}
.givens{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 10px}
.givens span{font-family:'JetBrains Mono',monospace;font-size:11.5px;padding:4px 9px;border-radius:8px;background:rgba(34,211,238,.09);border:1px solid rgba(34,211,238,.28);color:#bfe9f4}
.tag{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.05em;padding:3px 10px;border-radius:999px;margin:0 6px 10px 0}
.tag.concept{background:rgba(34,211,238,.14);color:var(--cyan);border:1px solid rgba(34,211,238,.4)}
.tag.apply{background:rgba(251,191,36,.14);color:var(--gold);border:1px solid rgba(251,191,36,.4)}
.tag.calc{background:rgba(74,222,128,.14);color:var(--lime);border:1px solid rgba(74,222,128,.45)}
.tag.case{background:rgba(244,114,182,.16);color:var(--pink);border:1px solid rgba(244,114,182,.5)}
.tag.easy{background:rgba(74,222,128,.13);color:var(--lime)}.tag.medium{background:rgba(251,191,36,.13);color:var(--gold)}.tag.hard{background:rgba(251,113,133,.13);color:var(--red)}
.tag.trap{background:rgba(139,92,246,.2);color:#ddd0ff;border:1px solid rgba(139,92,246,.6);animation:trapGlow 2.2s ease-in-out infinite alternate}
@keyframes trapGlow{to{box-shadow:0 0 14px rgba(139,92,246,.55)}}
.opts{display:grid;gap:10px;margin-top:6px}
.opt{text-align:left;background:rgba(255,255,255,.04);border:1px solid var(--glass-brd);border-radius:12px;padding:14px 16px;cursor:pointer;font-family:inherit;font-size:14.5px;color:var(--ink);transition:.18s;position:relative;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--cyan);transform:translateX(3px)}.opt:disabled{cursor:default}
.opt .lt{font-family:'JetBrains Mono',monospace;color:var(--violet);font-weight:700;margin-right:10px}
.opt.correct{border-color:var(--lime);background:rgba(74,222,128,.16);box-shadow:0 0 34px rgba(74,222,128,.4);animation:popBig .6s var(--spring)}
.opt.wrong{border-color:var(--red);background:rgba(251,113,133,.2);box-shadow:0 0 34px rgba(251,113,133,.4);animation:shakeHard .55s}.opt.dim{opacity:.32}
@keyframes popBig{0%{transform:scale(1)}30%{transform:scale(1.075)}55%{transform:scale(.99)}75%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes shakeHard{0%,100%{transform:translateX(0) rotate(0)}12%{transform:translateX(-14px) rotate(-1.4deg)}26%{transform:translateX(14px) rotate(1.4deg)}42%{transform:translateX(-11px) rotate(-1deg)}58%{transform:translateX(11px) rotate(1deg)}74%{transform:translateX(-6px)}88%{transform:translateX(6px)}}
.why{margin-top:14px;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.4);border-radius:12px;padding:14px 16px;opacity:0;transform:translateY(8px);transition:.4s;max-height:0;overflow:hidden}
.why.show{opacity:1;transform:none;max-height:900px}
.why h5{margin:0 0 4px;color:var(--gold);font-size:13px}.why p{margin:0 0 8px;font-size:13.5px;color:#ffeec4;line-height:1.6}
.why p:last-child{margin-bottom:0}
.why .work{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:#ffe0a3;background:rgba(0,0,0,.28);border-radius:8px;padding:9px 11px;margin:8px 0;line-height:1.7;overflow-x:auto;white-space:pre-wrap}
.floater{position:fixed;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:28px;pointer-events:none;z-index:999;text-shadow:0 3px 14px rgba(0,0,0,.6);animation:rise 1.25s var(--spring) forwards}
@keyframes rise{from{opacity:1;transform:translateY(0) scale(.6)}to{opacity:0;transform:translateY(-110px) scale(1.6)}}
/* ===== BIG REACTION TEXT ===== */
.bigcall{position:fixed;left:50%;top:26%;transform:translateX(-50%);z-index:1000;pointer-events:none;font-weight:700;
  font-size:clamp(38px,9vw,86px);letter-spacing:-.01em;text-align:center;white-space:nowrap;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:callIn 1.6s var(--spring) forwards;filter:drop-shadow(0 0 32px rgba(139,92,246,.75))}
.bigcall.bad{background:linear-gradient(100deg,#FB7185,#F43F5E,#FDA4AF);-webkit-background-clip:text;background-clip:text;
  filter:drop-shadow(0 0 34px rgba(251,113,133,.8));animation:callBad 1.5s cubic-bezier(.2,1.3,.4,1) forwards}
@keyframes callIn{0%{opacity:0;transform:translateX(-50%) scale(.25) rotate(-9deg)}
  18%{opacity:1;transform:translateX(-50%) scale(1.28) rotate(3deg)}
  32%{transform:translateX(-50%) scale(1) rotate(-1.5deg)}
  44%{transform:translateX(-50%) scale(1.1) rotate(0deg)}
  80%{opacity:1;transform:translateX(-50%) scale(1.02)}
  100%{opacity:0;transform:translateX(-50%) scale(1.14) translateY(-46px)}}
@keyframes callBad{0%{opacity:0;transform:translateX(-50%) scale(2.2) rotate(6deg)}
  16%{opacity:1;transform:translateX(-50%) scale(.9) rotate(-4deg)}
  26%{transform:translateX(-50%) scale(1.12) rotate(3deg)}
  38%{transform:translateX(-50%) scale(.98) rotate(-2deg)}
  50%{transform:translateX(-50%) scale(1.04) rotate(0deg)}
  82%{opacity:1}
  100%{opacity:0;transform:translateX(-50%) scale(.86) translateY(34px)}}
/* ===== GIANT STAMPS — the exaggerated reaction ===== */
.mega{position:fixed;left:50%;top:47%;z-index:999;pointer-events:none;user-select:none;line-height:1;
  font-size:clamp(150px,33vw,330px);filter:drop-shadow(0 22px 48px rgba(0,0,0,.75))}
.mega.down{animation:megaDown 1.5s cubic-bezier(.18,.85,.3,1) forwards}
@keyframes megaDown{
  0%{opacity:0;transform:translate(-50%,-160%) scale(.35) rotate(-42deg)}
  15%{opacity:1;transform:translate(-50%,-50%) scale(1.42) rotate(9deg)}
  25%{transform:translate(-50%,-50%) scale(1.02) rotate(-7deg)}
  36%{transform:translate(-50%,-50%) scale(1.24) rotate(5deg)}
  47%{transform:translate(-50%,-50%) scale(1.08) rotate(-3deg)}
  58%{transform:translate(-50%,-50%) scale(1.15) rotate(0deg)}
  78%{opacity:.95;transform:translate(-50%,-50%) scale(1.12)}
  100%{opacity:0;transform:translate(-50%,26%) scale(.82) rotate(17deg)}}
.mega.up{animation:megaUp 1.25s cubic-bezier(.2,1.35,.35,1) forwards}
@keyframes megaUp{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.15) rotate(-16deg)}
  20%{opacity:1;transform:translate(-50%,-50%) scale(1.3) rotate(7deg)}
  34%{transform:translate(-50%,-50%) scale(1) rotate(-4deg)}
  48%{transform:translate(-50%,-50%) scale(1.14) rotate(0deg)}
  72%{opacity:.9}
  100%{opacity:0;transform:translate(-50%,-130%) scale(1.3) rotate(6deg)}}
/* ===== flashes / vignettes ===== */
.flash{position:fixed;inset:0;z-index:997;pointer-events:none;background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.34),transparent 62%);animation:flashF .55s ease-out forwards}
@keyframes flashF{to{opacity:0}}
.greenflash{position:fixed;inset:0;z-index:996;pointer-events:none;background:radial-gradient(circle at 50% 45%,rgba(74,222,128,.30),transparent 64%);animation:flashF .6s ease-out forwards}
.redflash{position:fixed;inset:0;z-index:996;pointer-events:none;background:radial-gradient(circle at 50% 45%,rgba(251,113,133,.34),transparent 58%);animation:flashF .7s ease-out forwards}
.vignette{position:fixed;inset:0;z-index:996;pointer-events:none;box-shadow:inset 0 0 190px 60px rgba(244,63,94,.75);animation:vig .95s ease-out forwards}
@keyframes vig{0%{opacity:0}14%{opacity:1}100%{opacity:0}}
.vignette.good{box-shadow:inset 0 0 180px 54px rgba(74,222,128,.62);animation-duration:.85s}
.shakeit{animation:bodyShake .48s}
@keyframes bodyShake{0%,100%{transform:translate(0,0)}12%{transform:translate(-13px,4px) rotate(-.5deg)}26%{transform:translate(13px,-4px) rotate(.5deg)}40%{transform:translate(-10px,3px)}54%{transform:translate(10px,-3px)}68%{transform:translate(-6px,2px)}84%{transform:translate(6px,-2px)}}
.zoomit{animation:bodyZoom .5s var(--spring)}
@keyframes bodyZoom{0%,100%{transform:scale(1)}35%{transform:scale(1.014)}}
/* ===== crackers ===== */
.spark{position:fixed;z-index:998;pointer-events:none;animation:crkX var(--d) linear forwards}
.spark i{display:block;border-radius:50%;animation:crkY var(--d) cubic-bezier(.14,.72,.36,1) forwards, crkF var(--d) ease-in forwards}
@keyframes crkX{from{transform:translateX(0)}to{transform:translateX(var(--tx))}}
@keyframes crkY{0%{transform:translateY(0)}58%{transform:translateY(var(--ty))}100%{transform:translateY(calc(var(--ty) + 96px))}}
@keyframes crkF{0%,55%{opacity:1}100%{opacity:0}}
.boom{position:fixed;z-index:998;pointer-events:none;border:3px solid #fff;border-radius:50%;margin:0;animation:crkR .68s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes crkR{from{transform:translate(-50%,-50%) scale(.05);opacity:.98}to{transform:translate(-50%,-50%) scale(1);opacity:0}}
.rocket{position:fixed;z-index:998;pointer-events:none;width:4px;height:16px;border-radius:3px;margin-left:-2px;animation:crkL var(--rd) cubic-bezier(.25,.5,.4,1) forwards}
@keyframes crkL{from{transform:translateY(0) scaleY(1.35);opacity:.15}60%{opacity:1}to{transform:translateY(var(--ry)) scaleY(.7);opacity:.85}}
/* ===== thumbs — the shower ===== */
.tdown{position:fixed;z-index:998;pointer-events:none;user-select:none;line-height:1;filter:drop-shadow(0 3px 9px rgba(0,0,0,.6))}
.tdown.pop{animation:tdPop var(--d) cubic-bezier(.2,.7,.35,1) forwards}
@keyframes tdPop{0%{opacity:0;transform:translate(0,0) rotate(0deg) scale(.25)}
  12%{opacity:1}
  100%{opacity:0;transform:translate(var(--tx),var(--ty)) rotate(var(--rot)) scale(1.25)}}
.tdown.rain{animation:tdRain var(--d) linear forwards}
@keyframes tdRain{0%{opacity:0;transform:translateY(-40px) rotate(0deg)}
  9%{opacity:1}
  86%{opacity:1}
  100%{opacity:0;transform:translateY(var(--ty)) rotate(var(--rot))}}
.confetti{position:fixed;width:11px;height:15px;top:-20px;z-index:998;pointer-events:none;border-radius:2px}
/* ===== toast ===== */
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-160px);z-index:1001;background:rgba(9,13,28,.95);border:1px solid var(--gold);border-radius:14px;padding:12px 20px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.5);transition:transform .5s var(--spring);max-width:92vw}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast .em{font-size:26px}.toast .tt{font-weight:700}.toast .td{font-size:12px;color:var(--muted)}
/* ===== quiz ===== */
.qgroup-h{display:flex;align-items:center;gap:12px;margin:26px 2px 12px;scroll-margin-top:110px}
.qgroup-h .gi{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-family:'JetBrains Mono',monospace;font-weight:700;background:var(--grad);color:#08111f;font-size:13px}
.qgroup-h .gt{font-size:17px;font-weight:700}.qgroup-h .gc{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted)}
.qcard{background:var(--glass);border:1px solid var(--glass-brd);border-radius:16px;padding:20px 22px;margin-bottom:14px;backdrop-filter:blur(8px);transition:box-shadow .35s,border-color .35s}
.qcard.hitgood{border-color:rgba(74,222,128,.55);box-shadow:0 0 40px rgba(74,222,128,.22)}
.qcard.hitbad{border-color:rgba(251,113,133,.55);box-shadow:0 0 40px rgba(251,113,133,.22)}
.qnum{font-family:'JetBrains Mono',monospace;color:var(--muted);font-size:12px;margin-bottom:6px;display:flex;gap:10px;align-items:center}
.footbar{position:fixed;bottom:0;left:0;right:0;z-index:60;padding:10px 18px;background:rgba(9,13,28,.92);backdrop-filter:blur(14px);border-top:1px solid var(--glass-brd);display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.footbar .fp{flex:1;min-width:160px;display:flex;flex-direction:column;gap:5px}
.footbar .fp .lbl{font-size:12px;color:var(--muted);font-family:'JetBrains Mono',monospace}
.footbar .fp .bar{height:7px;border-radius:7px;background:rgba(255,255,255,.08);overflow:hidden}
.footbar .fp .bar i{display:block;height:100%;width:0;border-radius:7px;background:var(--grad);transition:width .5s var(--spring)}
.ring-wrap{display:flex;gap:30px;align-items:center;flex-wrap:wrap;justify-content:center}
.ring{position:relative;width:200px;height:200px}.ring svg{transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .mid .big{font-size:44px;font-weight:700;font-family:'JetBrains Mono',monospace;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.ring .mid .sm{font-size:12px;color:var(--muted);letter-spacing:.1em}
.grade{font-size:24px;font-weight:700;margin:4px 0}
.meters{margin-top:24px;display:grid;gap:12px}

<div class="bg-fx"><div class="orb a"></div><div class="orb b"></div><div class="orb c"></div><div class="orb d"></div></div>

<script>
/* =========================================================================
   MARKETING MANAGEMENT — QUIZ II  ·  case paper
   Source: MM101 Sessions 8-12 — the material after Quiz I.
           Sessions 8-9   Brand, and the 6P marketing mix; Proposition; the
                          four levels of Product; Price and RPI; Packaging.
           Session 10     Product Mix — features / performance / design,
                          blind tests, product hierarchy, demand spaces.
           Sessions 11-12 Pack-Price Architecture — the price ladder, pack
                          profitability, SOR, recruit & uptrade, shopper
                          missions, channels.
   Sessions 1-6 (5 Cs, segmentation, targeting, positioning) were Quiz I's
   ground, so they are referenced in the Why panels rather than re-tested.

   FORMAT: every question is a case. A situation, a decision or a claim is
   put on the table and you have to say what is actually going on — which is
   the same shape as the Quiz I paper (the Cult.Fit ad, the segment tables,
   the positioning map). The brands are invented — Lather, Silk and Purely
   in shampoo, CrunchLab in protein bars — so nothing depends on outside
   knowledge; the frameworks carry every answer.

   The correct option is always authored FIRST in `opts`; positions are
   reshuffled on every attempt.
   ========================================================================= */

const $=s=>document.querySelector(s), el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const rnd=a=>a[Math.floor(Math.random()*a.length)];

/* ---------------- topics ---------------- */
const TOPICS=[
 {id:'brand', name:'Brand & the 6P Mix',      kick:'diagnose the mix · Lather'},
 {id:'mix',   name:'Proposition, Product, Price', kick:'product levels · RPI calls', hot:true},
 {id:'pmix',  name:'Product Mix',             kick:'blind tests · demand spaces'},
 {id:'pack',  name:'Pack-Price Architecture', kick:'ladders · recruit & uptrade', hot:true},
];

/* ---------------- the quiz ----------------
   Every question is a case: a situation, a decision or a claim on the table,
   and you have to say what is actually going on. The brands are invented —
   Lather, Silk, Purely (shampoo) and CrunchLab (protein bars) — so nothing
   turns on outside knowledge; everything turns on the frameworks.

   t=topic, tag=concept|apply|case|calc, diff, trap=true (marked tricky),
   given=[chips], q=stem, opts=[correct, ...distractors], why=explanation
   Correct option is always authored FIRST; positions reshuffle every attempt. */
const QUIZ=[

/* ============ 01 · BRAND & THE 6P MIX ============ */
{t:'brand',tag:'case',diff:'easy',
 q:'<b>Lather</b> has spent two years discounting hard on quick commerce. Aided awareness is now <b>92%</b>. But in the same survey, most consumers cannot say what Lather stands for, and <b>70% say they would switch for ₹20 less</b>. The founder tells the board: “92% awareness — we are clearly a strong brand now.” What is the honest diagnosis?',
 opts:['Lather has <b>saliency</b> but none of the other three — no meaning, no differentiability, no trust. Being recognised makes it a well-known <i>name</i>, not yet a brand',
       '92% awareness clears the bar. The switching number is a Price problem, to be fixed in the Price P, not a brand problem',
       'It is a strong brand with weak visual identity — the fix is a logo and packaging refresh',
       'The question cannot be answered until Lather registers its trademark, since a brand is legally the registered sign'],
 why:'The deck’s test is four-part: a <b>name</b> becomes a <b>brand</b> when it has <b>meaning, saliency, differentiability and trust</b>. Lather has bought exactly one of them. And Keller’s definition tells you why the other three matter commercially — a brand is a set of mental associations that <b>add to the perceived value</b>. If 70% will leave for ₹20, the associations are adding roughly ₹20 of perceived value, which is to say almost none.<br><br>The Price answer inverts cause and effect: price sensitivity that high <i>is</i> the symptom of nothing being built above the product. And a trademark is a legal registration — you can own one and still have a name nobody attaches meaning to.'},

{t:'brand',tag:'case',diff:'medium',trap:true,
 q:'Lather’s marketing head opens the annual plan: <i>“Our proposition for next year is a ₹99 entry price, 40% off on quick commerce for launch month, and 200 fitness influencers on Instagram.”</i> What has she actually put on the table?',
 opts:['Price and Promotion decisions. She has not stated a <b>proposition</b> at all — no idea of what Lather wants to stand for in the consumer’s mind, which leaves the other Ps nothing to line up behind',
       'A complete proposition — the proposition is the total offer the consumer receives, which is price plus deal plus communication',
       'A positioning statement, which is the same thing as a proposition under a different name in the 6P framework',
       'A Product decision, since price and influencer choice are how a consumer experiences a product today'],
 why:'<b>Proposition: what a brand wants to stand for in the minds of the consumer.</b> Everything she listed is a tactic that could be swapped out next quarter without changing what the brand means.<br><br>The test to apply: <i>would this survive a complete change of media plan and price point?</i> Surf excel’s <b>“Daag Achhe Hain — if you get dirty in the act of doing good, then dirt is good”</b> would. It is the proposition; TV, print, outdoor and digital are the Promotion that carries it, and the 120–200 RPI is the Price that has to be consistent with it. A discount is not an idea.<br><br>On the third option: Positioning and Proposition are close relatives but sit in different boxes of the Marketing Management Process. <b>Positioning</b> is the STP decision — the unique value you choose to offer a defined target. <b>Proposition</b> is the mix element that carries it into execution. Positioning is not one of the six Ps.'},

{t:'brand',tag:'case',diff:'easy',
 q:'Lather’s plan is presented P by P: sulphate-free formula · ₹340 for 340 ml · 4,000 kiranas plus Blinkit and Zepto · Instagram and YouTube · amber pump bottle with a refill pouch. Which of the six Ps is missing — and why does its absence matter most?',
 opts:['<b>Proposition.</b> Without a stated idea of what Lather stands for, the other five Ps have nothing to align to — and the deck’s rule is that the elements of the mix are inter-related',
       '<b>Positioning</b> — it is the sixth P and belongs next to Price',
       '<b>People</b> — the sixth P in the course’s framework',
       'Nothing is missing. The four classic Ps are covered and Packaging is a bonus'],
 why:'Walk the list: Product (sulphate-free formula) · Price (₹340/340 ml) · Place (kiranas + quick commerce) · Promotion (Instagram, YouTube) · Packaging (amber pump bottle, refill pouch). Five of six. <b>Proposition</b> is absent.<div class="work">The course’s six:\n  Product · Price · Place · Promotion · Packaging · Proposition\n\nNot Ps:\n  Positioning → sits upstream, in STP\n  People / Process / Physical evidence\n                → the 7P services extension</div>And the absence is not cosmetic. A plan with five Ps and no organising idea produces exactly the failure Quiz I tested — execution that contradicts itself, because nothing tells you whether ₹340 is the right price or a pump bottle is the right pack.'},

{t:'brand',tag:'case',diff:'medium',
 q:'Lather decides to go upmarket: <b>RPI from 85 to 140</b>. It keeps the same 200 ml PET bottle with the flip cap it has used since launch, the same 4,000 kiranas, and the same line — <i>“Great hair, honest price.”</i> What is wrong here?',
 opts:['Price has moved and nothing else has. A premium price sitting on a value pack, a value proposition and a value channel reads as an unjustified price rise — the elements of the mix are inter-related, so they have to move together',
       'Nothing is wrong. Price is an independent lever and can be pulled on its own so long as margin improves',
       'The only error is Place — a kirana store cannot stock a premium product',
       'The error is the number. An RPI of 140 is impossible, since RPI cannot exceed 100'],
 why:'The deck’s closing slide on the mix is the whole answer: <b>the elements of the mix are inter-related.</b> Moving to RPI 140 means asking the consumer to pay <b>1.4× the category’s average price per unit</b>, and she will look for the reason in the other five Ps. Here every one of them still says “value”: the same flip-cap PET bottle, the same shelf, and a proposition that literally promises an <i>honest price</i>.<br><br>Compare Surf excel, whose 120–200 RPI is carried by a distinctive proposition and a full media plan behind it. The Place answer is too strong — kiranas sell premium products every day; the problem is the <i>combination</i>, not the channel alone. And an RPI above 100 is not just possible, it is the definition of a premium brand: 100 is the category average, not a ceiling.'},

{t:'brand',tag:'case',diff:'medium',
 q:'Three shampoos in the same price band: near-identical formulations, all around ₹0.90/ml, all in the same stores, all advertised at similar weight. One of them holds <b>twice the share</b> of the other two. Blind-tested, consumers cannot reliably tell them apart. What is doing the work?',
 opts:['The brand — the set of mental associations the consumer holds, which add to the <b>perceived</b> value. When products converge, the differentiation moves out of the product and into what the name means',
       'Nothing. A 2× share gap between indistinguishable products has to be a measurement error',
       'Place — the leader must simply have deeper distribution, since that is the only variable left',
       'Its blind-test result, which proves its performance quality is superior'],
 why:'This is the deck’s question <i>“what is a brand’s biggest challenge?”</i>, run in reverse. When formula, price, shelf and media weight are all held equal and share is not, the difference is sitting where Keller says the brand lives — in <b>mental associations that add to perceived value</b>. Perceived is the operative word: the blind test says the products are the same, and the market says the experience of buying them is not.<br><br>The Place option is ruled out by the setup (same stores), and the blind-test option contradicts it — consumers <i>could not tell them apart</i>, so there was no features win to have.'},

/* ============ 02 · PROPOSITION, PRODUCT, PRICE ============ */
{t:'mix',tag:'case',diff:'medium',
 q:'<b>CrunchLab</b> sells a 40 g bar: 20 g protein, no added sugar, dates, almonds and cocoa. Buyers who never read the pack still assume <i>“this will help me build muscle.”</i> R&D has a 25 g-protein version and three new flavours ready for next year. Which of these is the <b>Expected</b> product?',
 opts:['“It will help me build muscle” — the benefit the buyer assumes she is getting, whether or not the pack ever claims it',
       'The 20 g of protein, no added sugar, dates, almonds and cocoa — the specification actually shipped',
       'A protein bar — the basic need the product serves',
       'The 25 g version and the three new flavours waiting in R&D'],
 why:'The four levels, mapped onto this case:<div class="work">Core       a protein bar\nGeneric    20g protein, no added sugar, dates,\n           almonds, cocoa — what is actually shipped\nExpected   “it will help me build muscle” —\n           what she assumes she is buying\nPotential  25g protein, three new flavours —\n           what it could become</div>The <b>Expected</b> level is the one managers skip, and it is the dangerous one, because it is an assumption the consumer makes on your behalf and then holds you to. CrunchLab never printed a muscle-gain claim; it will still be judged against one. That is the level where unadvertised promises get broken.'},

{t:'mix',tag:'case',diff:'medium',
 q:'CrunchLab’s proposition is <i>“the clean protein bar — nothing you cannot pronounce.”</i> Its bestselling flavour uses a synthetic sweetener listed on the pack as E955. A consultant advises: <i>“the proposition lives in the consumer’s mind, so it only matters what we say — leave the formula alone and stop mentioning the ingredient.”</i> What does the course say?',
 opts:['The <b>product is the proof</b> of the promise the proposition makes. A proposition the product contradicts gets found out, and what it costs you is <b>trust</b> — one of the four things that made the name a brand',
       'The consultant is right. The proposition is a mental association, so only what is communicated matters',
       'The fix is to move the claim into the Promotion P, where softer language is permitted',
       'The fix is to raise the price — a premium RPI signals cleanliness and offsets the ingredient'],
 why:'Session 10 opens on exactly this: <b>“Proposition is the promise of value that a brand provides. Product is the proof of that promise.”</b> The two are not independent, and the direction of dependence matters — a proposition can be written in an afternoon; the product is what has to survive contact with a consumer who turns the pack over.<br><br>The consultant’s error is to treat “lives in the mind” as “is unfalsifiable”. The associations in the consumer’s mind are built by <i>use</i>, and one of the four is trust. Note also that this is not fixable in another P: shifting the claim to Promotion changes who says it, not whether it is true, and a higher price makes the contradiction more expensive, not less.'},

{t:'mix',tag:'calc',diff:'medium',
 q:'Lather’s founder wants to claim <i>“we are roughly a third cheaper than the category.”</i> Category is all 1-litre packs. Using <b>RPI</b>, what is the right read on Lather?',
 given:['Lather · ₹340 · 600 units','Silk · ₹600 · 300 units','Purely · ₹1,200 · 100 units'],
 opts:['RPI ≈ <b>67</b> — Lather sells at about two-thirds of the category’s share-weighted average price. The claim stands',
       'RPI ≈ <b>48</b> — average the three prices and Lather is under half the category',
       'RPI ≈ <b>28</b> — against Purely, the most expensive brand in the category, Lather is a quarter of the price',
       'RPI ≈ <b>100</b> — Lather is the biggest brand, so by definition it sets the category average'],
 why:'<div class="work">Shares from units (total 1,000):\n  Lather 60%   Silk 30%   Purely 10%\n\nCategory weighted-average price\n  = 0.6(340) + 0.3(600) + 0.1(1200)\n  = 204 + 180 + 120  =  ₹504\n\nRPI(Lather) = 340 / 504 = 0.67  →  67</div>The two wrong methods are the two you have to be able to refuse. <b>48</b> comes from averaging the three prices unweighted (₹713) — that treats Purely’s 100 units as equal in weight to Lather’s 600, when what you want is the price the typical rupee in the category actually pays. <b>28</b> benchmarks against the priciest brand; RPI is always measured against the <i>average</i>, never an extreme.<br><br>The last option is nearly interesting and still wrong: Lather being 60% of volume does drag the average down, so its own weight flatters the “third cheaper” claim — but the average is ₹504, not ₹340, because the other 40% is priced well above it.'},

{t:'mix',tag:'calc',diff:'medium',trap:true,
 q:'Silk launches a <b>180 ml at ₹149</b>. Lather sells <b>200 ml at ₹199</b>. A junior analyst circulates a note: <i>“Silk has gone 25% cheaper than us — we should cut price.”</i> What is the right read?',
 given:['Silk · 180 ml · ₹149','Lather · 200 ml · ₹199'],
 opts:['On price per ml, Silk is ₹0.83 against Lather’s ₹1.00 — about <b>17% cheaper</b>, not 25%. The pack comparison overstates the gap because the two packs are different sizes',
       'The analyst is right — the shopper sees ₹149 next to ₹199 on the shelf, so pack price is the comparison that counts',
       'Silk is in fact <i>more</i> expensive per ml, so Lather should hold price or raise it',
       'The comparison cannot be made at all — RPI is only defined between identical pack sizes'],
 why:'<div class="work">Silk    149 / 180 = ₹0.828 per ml\nLather  199 / 200 = ₹0.995 per ml\n\nGap = 1 − (0.828 / 0.995) = 16.8%  →  ~17%</div>Grammage always comes out first. The deck makes the same point on its second RPI table, where ₹200 for 500 ml is <b>four times</b> ₹100 for 1,000 ml even though the headline prices are only 2× apart.<br><br>The shelf-price answer confuses two different questions. What the shopper <i>notices</i> is a real input into a pack-price decision — it is why ₹149 and ₹199 price points exist at all. But it is not a price comparison, and a 17% gap and a 25% gap imply very different responses. And the last option is the trap worth naming: restricting yourself to matching pack sizes is not a stricter method, it is a method that stops working the moment either brand changes its range — which is precisely what a pack-price architecture is designed to do.'},

{t:'mix',tag:'case',diff:'easy',
 q:'Three Lather packaging briefs. <b>(a)</b> a 10 ml sachet strip hung at the kirana counter, bought without planning · <b>(b)</b> a pump added to the 340 ml after complaints about spilling in the shower · <b>(c)</b> a matte-black redesign, briefed to “stand out on a quick-commerce grid full of white bottles.” Which mapping to the deck’s three jobs is right?',
 opts:['(a) impulse driver · (b) smoothing the rough edges · (c) clutter breaking',
       '(a) clutter breaking · (b) impulse driver · (c) smoothing the rough edges',
       '(a) smoothing the rough edges · (b) clutter breaking · (c) impulse driver',
       'None of them — all three are Product decisions, since they change how the product is used'],
 why:'The deck’s line is that <b>packaging brings the purpose alive</b>, through three jobs:<div class="work">Impulse driver   the pack triggers an unplanned buy\nClutter breaking the pack gets seen among\n                 near-identical competitors\nSmoothen the     the pack fixes friction in using\nrough edges      the product</div>A counter strip bought without planning is textbook <b>impulse</b>. A pump that stops spilling is <b>smoothing the rough edges</b> — note it changes nothing about the shampoo itself. And a matte-black bottle briefed against a grid of white ones is <b>clutter breaking</b>, the digital-shelf version of the supermarket problem.<br><br>The last option is worth refusing deliberately: all three are marketing jobs done by the pack, which is exactly why Packaging is a full P in this course rather than a footnote under Product.'},

{t:'mix',tag:'case',diff:'medium',
 q:'Lather’s board sets a three-year goal: <b>“get to an RPI of 130.”</b> The marketing head has to explain to them what they have just committed the company to. Which explanation is right?',
 opts:['Selling at about 1.3× the category’s share-weighted average price per unit — which is a claim about what the consumer believes the brand is worth, so it commits Product, Packaging and Proposition to justify it, not just the price sticker',
       'A 130% gross margin on every pack sold',
       'Being 130% more expensive than the cheapest brand on the shelf',
       'Growing to 130 index points of market share against this year’s base of 100'],
 why:'<b>RPI = brand price per unit ÷ category weighted-average price per unit × 100.</b> So 130 means 1.3× the average — the same neighbourhood as Surf excel’s 120–200.<div class="work">RPI 100   at the category average\nRPI &lt;100  value end\nRPI &gt;130  premium — 1.3× the average</div>The important half of the answer is the second clause. RPI is a <i>price</i> measure, but a price the consumer will actually pay is an outcome of the whole mix — which is why this is a three-year goal and not a pricing memo. The board has committed to building a product, pack and proposition that make 1.3× believable.<br><br>Note what RPI is not: it says nothing about <b>margin</b> (a 130 RPI on a costly product can be thin), and its benchmark is the category <b>average</b>, never the cheapest brand.'},

/* ============ 03 · PRODUCT MIX ============ */
{t:'pmix',tag:'case',diff:'medium',trap:true,
 q:'CrunchLab blind-tests its bar against the category leader on taste, texture and after-taste with 400 people, and wins all three <b>60:40</b>. Six months after launch its share is <b>3%</b>. The founder concludes the blind test must have been wrong. Is he right?',
 opts:['No. The blind test established a win on <b>features</b>, with brand, pack and price stripped out — it never claimed anything about what happens when the consumer can see whose bar it is, and it cannot measure performance quality or the other five Ps',
       'Yes. A features win should convert into share automatically, so the test was badly run',
       'No — the test measured performance quality, so what changed is the defect rate after launch',
       'No — the three attributes must have been points of difference, so CrunchLab should retest on points of parity'],
 why:'The word doing the work is <b>blind</b>. Removing the brand, the pack and the price is what makes the test a clean read on the product — and is exactly what limits it. Everything stripped out is added straight back in the real market, where the shopper meets a name she has never heard of, on a shelf, next to a leader she trusts.<div class="work">A blind test CAN establish   a win on features\nIt CANNOT establish         performance quality\n                            (stability + defect rate,\n                             which need time)\nIt CANNOT establish         that anyone will buy you</div>The deck’s closing line covers it: <b>there is no such thing as a definitively better product.</b> A 60:40 features win with 3% share is not a contradiction — it is the normal state of a new brand that has won the product argument and not yet won any of the others.'},

{t:'pmix',tag:'case',diff:'medium',
 q:'Three complaint patterns land on CrunchLab’s desk. <b>(a)</b> the bar tastes different in summer batches · <b>(b)</b> 1 in 30 bars arrives crumbled inside an intact wrapper · <b>(c)</b> it is too hard to bite straight out of the fridge. Which product-quality parameters are being hit?',
 opts:['(a) and (b) are both <b>performance quality</b> — the deck’s two measures, stability over time and defect rate. (c) is <b>design</b> — look, feel, usability',
       'All three are features problems — each is an attribute the product fails to deliver',
       '(a) is design · (b) is features · (c) is performance',
       'None touch product quality — all three are Packaging problems, and Packaging is a separate P'],
 why:'<div class="work">Features     which attributes does it deliver on?\nPerformance  does it deliver them consistently?\n             measured 2 ways:\n               stability  — does not change over time\n               defect-free — low defect rate\nDesign       look / feel / usability</div>(a) is the batch-to-batch variation the deck calls <b>stability</b>. (b) is a straight <b>defect rate</b>. Both sit under Performance, which is why the deck insists performance is measured in exactly those two ways.<br><br>(c) is the one people misfile. Nothing is defective and nothing has changed — the bar simply does not work well in the hand at fridge temperature. That is <b>usability</b>, and usability is Design. Note the wrapper is intact in (b), which is what keeps it a product-quality finding rather than a packaging one.'},

{t:'pmix',tag:'case',diff:'medium',
 q:'Lather sells <b>one</b> shampoo — anti-hairfall — in four sizes: 10 ml sachet, 180 ml, 340 ml, 650 ml. The team proposes adding an anti-dandruff and a colour-protect variant. In the deck’s vocabulary, what are they proposing, and what do they already have?',
 opts:['They are proposing two new <b>products</b>, covering two new <b>demand spaces</b>. What they already have is one product built out into four <b>SKUs</b>',
       'They are proposing four new SKUs. What they already have is four products',
       'They are proposing two new categories. What they already have is one category holding four products',
       'They are proposing two new points of difference. What they already have is four points of parity'],
 why:'<div class="work">Company → Category → Product → SKU\n                     (demand    (pack size /\n                      space)     format)</div>Four sizes of one formulation are four <b>SKUs</b> — depth. Anti-dandruff and colour-protect are two different <b>needs</b>, so they are two new <b>products</b> covering two new <b>demand spaces</b> — width. The deck’s own shampoo example lists the spaces: anti-dandruff, hairfall protection, hair strength, smooth hair, damage protection.<br><br>The distinction decides the business case. Width is justified by needs you are not currently serving; depth is justified by pack-price and shopper-mission arguments. Confuse them and you end up launching a pack size to solve a needs problem, or a variant to solve a cash-outlay problem.'},

{t:'pmix',tag:'case',diff:'medium',
 q:'Lather launches all five shampoo variants at once. Twelve months on: total category share is <b>flat</b>, shelf facings per variant in kiranas have fallen, two variants sell under 4% of volume each, and shoppers describe the range as “confusing.” Which of the deck’s costs of width have materialised?',
 opts:['All three the deck names — <b>cost</b> (five supply chains carrying the same volume), <b>splitting consumer attention</b> (the confusion and the lost facings), and a <b>higher chance of failure</b> (the two dead variants)',
       'None. Flat share with more variants proves healthy cannibalisation, which is the intended outcome of width',
       'Only cost. Consumer attention and failure rate are Promotion problems, not product-mix problems',
       'This is a price-ladder failure — five variants breach the ladder by definition'],
 why:'The deck puts one benefit against three costs:<div class="work">+  catering to different demand spaces\n\n−  cost\n−  splitting consumer attention\n−  higher chance of failure</div>Every one of the three has shown up here in a measurable form. The instructive part is that the benefit has <i>not</i>: flat category share means the five variants are not reaching needs the one variant was missing — they are dividing the same demand between more products, and paying five times to do it.<br><br>Note what the case does not tell you: whether the variants were wrong or the execution was. Width is a real strategy — it is just one whose costs land immediately and whose benefit only lands if the demand spaces were genuinely unserved. The price ladder is a pack-size rule and has nothing to do with variant count.'},

{t:'pmix',tag:'case',diff:'easy',
 q:'Lather, a shampoo company, is weighing two moves: a face wash, and a range of home-cleaning liquids. A board member asks what business a shampoo company has in either. What reason does the course give for operating across categories?',
 opts:['<b>Synergies</b> — in distribution, manufacturing and capabilities: the same kiranas and quick-commerce warehouses, the same liquid-filling lines, the same formulation and pack know-how',
       'Because more categories mean more demand spaces, and more demand spaces always mean more profit',
       'Because a company must operate in at least three categories before it can be called a brand',
       'Because breadth lowers RPI, and a lower RPI grows share'],
 why:'The deck’s answer to <i>“why do companies operate in more than one category?”</i> is three words: <b>distribution, manufacturing, capabilities</b>. That is also the test to apply to the two moves in front of the board — both share the distribution and the filling lines, so both clear the synergy bar on those two; the formulation and consumer capability is a much better fit for face wash than for floor cleaner.<br><br>Note the difference in logic one level down. Multiple <b>categories</b> are justified by synergies on the supply side. Multiple <b>products within</b> a category are justified by demand spaces on the consumer side. Different question, different answer.'},

{t:'pmix',tag:'case',diff:'medium',trap:true,
 q:'Two shampoos. <b>Lather</b>: best cleaning in lab tests, mild fragrance, ₹1.00/ml. <b>Silk</b>: cleans adequately, strong fragrance that lasts till evening, ₹0.60/ml. A consultant’s deck concludes: “Lather is the better product, full stop.” What is the course’s response?',
 opts:['There is no definitively better product. Better is relative to the attributes the chosen target values — for a segment that buys shampoo for a fragrance that lasts the day, Silk wins on the attribute that decides the purchase',
       'The consultant is right — lab cleaning performance is the objective measure of a shampoo',
       'Neither is better, because a shampoo and a fragrance product are different categories',
       'Silk is better, because in an Indian mass category the lower price per ml always wins'],
 why:'Session 10 runs three <i>“which of these is a better product?”</i> comparisons and refuses to answer any of them, closing with <b>“there is no such thing as a definitively better product.”</b> The question is incomplete until you say <b>better for whom, on which attribute</b> — which is the bridge straight back to STP: the target segment decides which attributes count.<br><br>Note the two ways to get this wrong. The consultant picks one attribute (cleaning) and calls it objective. The last option picks a different attribute (price) and calls <i>that</i> universal — same mistake, opposite direction. The deck’s actual takeaway keeps the discipline in place: <b>to secure a product win, you want to win on one or more of the <i>relevant</i> attributes.</b> Relative, not arbitrary.'},

/* ============ 04 · PACK-PRICE ARCHITECTURE ============ */
{t:'pack',tag:'calc',diff:'medium',
 q:'Lather’s proposed price list is on the table. Which rung breaks the <b>price ladder</b>, and why does it matter?',
 given:['100 ml · ₹120','250 ml · ₹250','500 ml · ₹560','1 L · ₹1,000'],
 opts:['The <b>500 ml</b>, at ₹1.12/ml — dearer per ml than the 250 ml below it. A shopper trading up is asked to pay more per ml for buying more, so the uptrade stalls at 250 ml',
       'The <b>100 ml</b>, because the smallest pack should be the cheapest per ml',
       'The <b>1 L</b>, because a four-figure price crosses a threshold shoppers resist',
       'None of them. The ladder governs absolute prices, and those rise correctly with size'],
 why:'<div class="work">100 ml   120 / 100  = ₹1.20 /ml\n250 ml   250 / 250  = ₹1.00 /ml\n500 ml   560 / 500  = ₹1.12 /ml   ← breaks\n1 L     1000 / 1000 = ₹1.00 /ml</div>The deck’s rule: <b>price per unit must not rise as the pack grows</b> — a ≥ b ≥ c ≥ d. The 500 ml goes back up, so the ladder has a broken rung in the middle of it, and the consequence is behavioural: a shopper standing in front of the 250 ml has no reason to reach for the 500 ml, because she would be paying a premium for the privilege of buying more.<br><br>The second option inverts the rule. The <b>smallest pack is the dearest per ml</b> — that is the ladder working correctly, and it is what protects the larger packs from being cannibalised. And the last option gets the variable wrong: absolute price of course rises with size; the ladder is about price <i>per unit</i>.'},

{t:'pack',tag:'calc',diff:'medium',
 q:'Lather’s finance team lays out the per-pack economics. Which pack should the brand be pushing hardest, and what is the mechanism behind it?',
 given:['180 ml · realisation ₹150 · cost ₹60','340 ml · ₹260 · cost ₹85','650 ml · ₹460 · cost ₹120'],
 opts:['The <b>650 ml</b>, at about <b>74%</b> against 60% on the 180 ml — raw material scales with volume, while packaging and other near-fixed costs spread across more millilitres',
       'The <b>340 ml</b>, at about 67% — the mid pack is always the margin optimum',
       'The <b>180 ml</b>, at about 60% — it is the smallest pack and therefore the highest margin',
       'The <b>180 ml</b>, because it carries the highest price per ml, and price per ml is what margin follows'],
 why:'<div class="work">180 ml   150 − 60  = 90   →  60.0%\n340 ml   260 − 85  = 175  →  67.3%\n650 ml   460 − 120 = 340  →  73.9%</div>Margin climbs with pack size, and the deck shows the reason in its own cost split: <b>raw material scales with volume</b> (10 → 40 → 100 in the deck’s table), but <b>packaging cost barely moves</b> (15 → 20 → 25) and <b>other costs are near-flat</b> (10 → 15 → 20). Spread those near-fixed components over ten times the volume and cost per ml collapses.<br><br>The last option is the one worth dismantling, because it sounds right. The 180 ml <i>does</i> carry the highest price per ml — that is the price ladder working. But margin is price <i>minus cost</i> per ml, and cost per ml falls faster than price per ml does. High price per ml and low margin sit together perfectly comfortably.'},

{t:'pack',tag:'case',diff:'medium',
 q:'Two households each get through about 650 ml of Lather a year. <b>Household A</b> buys the 650 ml pack once. <b>Household B</b> buys the 180 ml four times. A rival launches an eight-week sampling blitz. Which household is more at risk — and what is the concept?',
 opts:['<b>B.</b> She reaches a purchase decision four times a year instead of once, so she meets the rival’s campaign more often. The concept is <b>Share of Requirement</b> — a bigger pack locks the household in for longer and gives competitors fewer chances to be bought',
       '<b>A.</b> A large-pack buyer has more sunk into the decision, so when she does switch she switches harder',
       'Neither. Switching risk is set by advertising weight, not by pack size',
       '<b>B</b> — but the concept is the price ladder, which is what is keeping her in small packs'],
 why:'This is the deck’s <b>SOR</b> slide made concrete. Share of Requirement is the proportion of a household’s category consumption that comes to your brand, and pack size is a lever on it that has nothing to do with advertising: <b>locking in consumers for longer increases share</b>.<div class="work">Household A   1 purchase decision / year\nHousehold B   4 purchase decisions / year\n              → 4× the exposure to a switching moment</div>Same consumption, same brand, four times the risk. Note this is a <i>defensive</i> argument — the deck pairs it with profitability as the second reason to push larger packs, and it is about protecting consumption you already have, not creating more.<br><br>The last option names the right household for the wrong reason: the ladder is the pricing rule across sizes, not an explanation of why she buys small. Her cash outlay per trip is why she buys small.'},

{t:'pack',tag:'case',diff:'medium',trap:true,
 q:'It is 8:40 pm. A shopper has a wedding to leave for at 10. Her shampoo bottle is empty. She walks to the kirana at the end of her lane and buys whatever 10 ml sachets they have, without checking the price. Which <b>shopper mission</b> is this?',
 opts:['<b>Just in Time</b> — the need appeared without warning, so the pack has to be small, immediately available and in general trade. Price is secondary because availability is the binding constraint',
       '<b>Experiential</b> — she is buying for a wedding, and an occasion purchase is an experiential mission',
       '<b>Routine Purchase</b> — shampoo is a product she buys every month',
       '<b>Research</b> — she is choosing between the sachet options on the shelf'],
 why:'The mission is defined by <b>how she is shopping</b>, not by what the product is or what the occasion is. The deck’s four:<div class="work">Routine       the monthly shop, with a list\nJust in Time  snacks for an impromptu party\nExperiential  apparel for an upcoming event\nResearch      buying a new phone</div>Everything here says Just in Time: unplanned, urgent, nearest store, no price check. The <b>Experiential</b> answer is the trap — a wedding sounds like the deck’s “upcoming event”, but that example is about <i>treating yourself</i>, where the shopping itself is the pleasurable part. Nothing about a 8:40 pm sachet run is that. And Routine is ruled out by the same product being bought in a completely different mode — she buys shampoo monthly, but she is not doing that tonight.<br><br>The pack consequence is the point of the whole slide: this trip is where a 10 ml sachet in general trade earns its existence, and no amount of 650 ml value-pack economics is relevant to it.'},

{t:'pack',tag:'case',diff:'medium',
 q:'Lather’s new head of sales proposes killing the 10 ml sachet: it is <b>22% of volume but 6% of profit</b>, and the warehouse hates handling it. What does the course say about that trade?',
 opts:['The sachet is the <b>recruit</b> rung — the low-cash-outlay entry that brings consumers in so they can be uptraded. Killing it lifts margin per pack while shutting off the funnel that feeds the ladder; a brand needs to recruit across pack sizes <i>as well as</i> uptrade',
       'He is right. Only the largest pack matters, since it carries both the highest margin and the highest SOR',
       'He is right, and the freed shelf space will uptrade sachet buyers into the 180 ml automatically',
       'He is wrong, because removing a rung is itself a breach of the price ladder'],
 why:'The deck draws <b>recruit</b> and <b>uptrade</b> arrows across the pack ladder, and marks recruit at more than one rung. The sachet’s job is not to make money — it is to be a low-risk first purchase for someone who has never bought you. Its 6% profit share is what recruitment looks like on a P&L, not evidence that it is failing.<div class="work">Recruit   small packs — low cash outlay, low risk\nUptrade   move her up the ladder once she is in\n          → better margin, better SOR</div>The deck’s takeaway settles it: <b>a brand needs to recruit across pack sizes as well as uptrade.</b><br><br>The third option contains the real-world temptation and the real-world error: uptrade is something you have to <i>engineer</i>, through the ladder and the range. Take away the entry rung and a large share of those buyers do not step up — they step out, to whichever competitor still sells a sachet. And removing a pack size does not breach the ladder; the ladder constrains prices across the sizes you do sell.'},

{t:'pack',tag:'case',diff:'medium',trap:true,
 q:'To fight a cheap rival, Lather launches a <b>90 ml “value pack” at ₹63</b>, alongside its 180 ml at ₹149 and 340 ml at ₹250. Six months on: the 90 ml sells well, <b>total brand volume is flat</b>, and 180 ml and 340 ml volumes are both down. What has happened?',
 given:['90 ml ₹63 → ₹0.70/ml','180 ml ₹149 → ₹0.83/ml','340 ml ₹250 → ₹0.74/ml'],
 opts:['<b>Active downgradation from self.</b> Priced below the larger packs per ml, the value pack inverted the ladder — so instead of recruiting new users it pulled existing buyers down into a lower-value pack',
       'The rival’s campaign has worked and Lather has lost share. The value pack is unrelated to the decline',
       'The value pack is working exactly as intended — recruitment always shows up as flat volume in year one',
       'The 90 ml is loss-making, because packaging cost per ml is highest on the smallest pack, and that is what dragged volume down'],
 why:'The deck’s warning slide carries two lines, and this is the second: <b>reducing pack sizes can lead to active downgradation from self.</b> The signature is exactly what the case reports — the new pack sells, the big packs fall, and the total does not move. Nobody new arrived; your own buyers changed rungs.<br><br>Look at what the pricing did:<div class="work">90 ml   ₹0.70 /ml   ← cheapest per ml. Ladder inverted.\n180 ml  ₹0.83 /ml\n340 ml  ₹0.74 /ml</div>A correctly laddered 90 ml would be the <b>dearest</b> per ml — above ₹0.83. That premium is not greed; it is the <b>guardrail</b> that makes stepping down unattractive to a 340 ml buyer. Price the small pack attractively per ml and you have personally removed the thing stopping the downgrade.<br><br>The last option is true and irrelevant: packaging cost per ml <i>is</i> highest on small packs — which is why they are supposed to carry the highest price per ml, not why volume fell.'},

{t:'pack',tag:'case',diff:'medium',
 q:'Lather pushes its single 340 ml bottle through all three channels. Results: strong in modern trade · kirana owners say it “blocks too much money” · on quick commerce it keeps losing to a rival’s 2 × 340 ml bundle. What is the diagnosis?',
 opts:['Packs have to be <b>customised by channel</b>. General trade needs a low cash-outlay pack the kirana can afford to stock and the shopper can afford to buy; eCommerce economics reward bundles and larger packs. One SKU cannot serve all three',
       'This is a Promotion problem — the same media plan is running across all three channels',
       'Nothing is wrong. A single pack size cannot breach the price ladder, so the architecture is sound',
       'Lather should exit general trade and quick commerce and concentrate where it already wins'],
 why:'The deck is explicit: packs are customised for <b>General Trade</b>, <b>Modern Trade</b> and <b>eCommerce</b>, and the case gives you one symptom from each. “Blocks too much money” is the kirana’s working-capital constraint — he stocks what turns fast at low value per unit, which is why sachets and small bottles exist. Losing to a bundle online is shipping economics — a delivery cost per order that rewards buying more at once.<br><br>Note that all three results are consistent with the 340 ml being a <i>good</i> pack. It is simply the only pack, and it happens to fit exactly one channel. The fix is range, not retreat — and “concentrate where you already win” would hand a brand two-thirds of a market for the sake of not building two more SKUs.'},

{t:'pack',tag:'case',diff:'medium',
 q:'Three memos land on the same pack decision. <b>Brand:</b> move everyone to the 650 ml — it lifts RPI and SOR. <b>Shopper research:</b> most target households cannot spend ₹460 in one go. <b>Channel:</b> kiranas will not stock anything above ₹100 a unit. What is this, and what does the course say to do?',
 opts:['The three objectives every pack decision has to balance — <b>brand, shopper and channel</b>. You resolve it across the two decisions available (pack format, and pack quantity–price): a laddered range that recruits at low cash outlay in general trade and uptrades into the 650 ml where shopper and channel can carry it',
       'The brand objective outranks the other two, since the brand carries P&amp;L responsibility',
       'It is a pricing problem alone — drop the 650 ml to ₹99 and all three objectives are satisfied at once',
       'It is a Place problem — exit general trade, whose objectives conflict with the brand’s'],
 why:'The deck’s slide is three overlapping circles: <b>Brand objective · Shopper objective · Channel objective</b>, with the note that packaging decisions have to balance all three. And it names the only two levers you actually have: <b>pack format</b> and <b>pack quantity–price</b>.<br><br>The resolution is a <i>range</i>, not a winner. That is what the whole pack architecture exists to do — a sachet or small bottle under ₹100 that the kirana will stock and the household can afford, laddered up to a 650 ml that delivers the brand’s RPI and SOR ambition in modern trade and quick commerce, where both the shopper’s basket and the channel can carry it.<br><br>Dropping the 650 ml to ₹99 is worth thinking through: it would satisfy everyone and destroy the ladder, the margin and the RPI goal in one move — you cannot solve a three-way constraint by conceding the objective you started with. And <b>shopper-backward thinking</b> is the deck’s framing for exactly this: start from the mission and the cash outlay, not from the pack you would prefer to sell.'},

];

 {h:'Pack-price architecture — the rules',

   SOUND — synthesised with WebAudio, no files, no network.
   The context is created lazily on the first click, which satisfies autoplay.
   ========================================================================= */
let AC=null, SOUND=true;
try{ if(localStorage.getItem('mm2_sound')==='0') SOUND=false; }catch(e){}
function ac(){
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(AC.state==='suspended') AC.resume();
  return AC;
}
function tone(freq,at,dur,type,vol,glideTo){
  const c=ac(); if(!c) return;
  const t0=c.currentTime+at;
  const o=c.createOscillator(), g=c.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(freq,t0);
  if(glideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,glideTo),t0+dur);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol||0.18,t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0+dur+0.03);
}
function noise(at,dur,vol,freq){
  const c=ac(); if(!c) return;
  const t0=c.currentTime+at, n=Math.floor(c.sampleRate*dur);
  const buf=c.createBuffer(1,n,c.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const src=c.createBufferSource(); src.buffer=buf;
  const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=freq||900;
  const g=c.createGain(); g.gain.setValueAtTime(vol||0.2,t0);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  src.connect(f); f.connect(g); g.connect(c.destination);
  src.start(t0); src.stop(t0+dur+0.02);
}
/* correct — a major arpeggio that climbs higher the longer the streak runs */
function sfxRight(streak){
  if(!SOUND) return;
  const base=523.25*Math.pow(2,Math.min(4,Math.floor((streak-1)/4))/12*2);
  const notes=[1,1.26,1.5,2];                         // root, M3, P5, octave
  notes.forEach((m,i)=>tone(base*m,i*0.055,0.26,'triangle',0.17));
  if(streak>=3) tone(base*2.52,0.235,0.34,'sine',0.13);
  if(streak>=7){ tone(base*3,0.30,0.4,'sine',0.11); noise(0,0.16,0.09,2600); }
  if(streak>=12){ [0,.09,.18].forEach((t,i)=>tone(base*(3+i*0.5),0.34+t,0.3,'triangle',0.09)); }
}
/* wrong — a fat descending buzzer plus a thud */
function sfxWrong(){
  if(!SOUND) return;
  tone(196,0,0.42,'sawtooth',0.20,72);
  tone(146.8,0.03,0.46,'square',0.13,58);
  noise(0,0.28,0.26,420);
  tone(92,0.16,0.3,'sine',0.16,46);
}
function sfxBadge(){ if(!SOUND) return; [784,988,1175,1568].forEach((f,i)=>tone(f,i*0.075,0.3,'triangle',0.15)); }
function sfxLevel(){ if(!SOUND) return; [392,523,659,784,1047].forEach((f,i)=>tone(f,i*0.07,0.34,'sine',0.16)); }
function sfxFanfare(){ if(!SOUND) return;
  [[523,0],[659,.1],[784,.2],[1047,.3],[784,.46],[1047,.56],[1319,.66]].forEach(([f,t])=>tone(f,t,0.5,'triangle',0.16));
  noise(0.3,0.5,0.08,3200); }
function sfxSad(){ if(!SOUND) return; [440,392,349,294].forEach((f,i)=>tone(f,i*0.16,0.4,'triangle',0.15)); }

const CRK=['#22D3EE','#8B5CF6','#F472B6','#4ADE80','#FBBF24','#FB7185','#FFFFFF'];
function burstAt(x,y,n,spread,size){
  const ring=el('div','boom');ring.style.left=x+'px';ring.style.top=y+'px';
  const rs=spread*1.6;ring.style.width=rs+'px';ring.style.height=rs+'px';
  ring.style.borderColor=rnd(CRK);document.body.appendChild(ring);setTimeout(()=>ring.remove(),740);
  for(let i=0;i<n;i++){
    const ang=(i/n)*Math.PI*2+Math.random()*0.4;
    const r=spread*(0.5+Math.random()*0.75);
    const s=el('div','spark'),dot=el('i');s.appendChild(dot);
    s.style.left=x+'px';s.style.top=y+'px';
    const col=rnd(CRK),w=size*(0.6+Math.random()*0.9);
    dot.style.background=col;dot.style.boxShadow='0 0 10px '+col+',0 0 22px '+col;
    dot.style.width=w+'px';dot.style.height=w+'px';
    const d=0.8+Math.random()*0.6;
    s.style.setProperty('--tx',(Math.cos(ang)*r).toFixed(1)+'px');
    s.style.setProperty('--ty',(Math.sin(ang)*r).toFixed(1)+'px');
    s.style.setProperty('--d',d.toFixed(2)+'s');

  }
}
function launchTo(x,y,n,spread,size){
  const rd=0.30+Math.random()*0.18;

/* tier 0: 2 shells · tier 1 (3+): 3 · tier 2 (7+): 5 + white flash
   tier 3 (12+): 8 shells, wider, plus a confetti barrage                    */
function crackers(x,y,streak){
  if(reduced)return;
  if(x==null||isNaN(x)){x=innerWidth/2;y=innerHeight/2;}
  const s=streak||1;
  const tier = s>=12?3 : s>=7?2 : s>=3?1 : 0;
  const shells=[2,3,5,8][tier];
  const grow=1.25+tier*0.32;
  burstAt(x,y,Math.round(20*grow),Math.round(120*grow),7+tier);
  const W=innerWidth,H=innerHeight;
  for(let i=0;i<shells;i++){
    const sx=W*(0.10+Math.random()*0.80), sy=H*(0.10+Math.random()*0.32);
    setTimeout(()=>launchTo(sx,sy,Math.round(26*grow),Math.round(150*grow),6+tier),70+i*130);
  }
  if(tier>=1)confetti(24*tier);
  if(tier>=3){
    confetti(90);
    setTimeout(()=>{for(let i=0;i<4;i++){const sx=W*(0.12+Math.random()*0.76),sy=H*(0.08+Math.random()*0.30);
      setTimeout(()=>launchTo(sx,sy,36,225,9),i*120);}},720);
  }
}
function confetti(count){if(reduced)return;const cols=['#22D3EE','#8B5CF6','#F472B6','#4ADE80','#FBBF24'];const n=count||100;

const cst=document.createElement('style');cst.textContent='@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.2}}';document.head.appendChild(cst);

function mcqNode(Q,card,onScore){
  const box=el('div','mcq');
  const tagLb={apply:'⚙ Apply',case:'🏷 Case',calc:'🧮 Calculate',concept:'◈ Concept'};
  let head='<span class="tag '+Q.tag+'">'+(tagLb[Q.tag]||'◈ Concept')+'</span>';
  if(Q.diff)head+='<span class="tag '+Q.diff+'">'+Q.diff+'</span>';
  if(Q.trap)head+='<span class="tag trap">🃏 tricky</span>';
  box.innerHTML=head+'<div class="q">'+Q.q+'</div>';
  if(Q.given)box.appendChild(el('div','givens',Q.given.map(g=>'<span>'+g+'</span>').join('')));
  const opts=el('div','opts');box.appendChild(opts);
  const letters=['A','B','C','D'],order=shuffle(Q.opts.map((o,i)=>({o,i})));let done=false;
  order.forEach((item,pos)=>{
    const b=el('button','opt','<span class="lt">'+letters[pos]+'</span>'+item.o);
    b.onclick=e=>{
      if(done)return;done=true;box.dataset.done='1';const ok=item.i===0;
      [...opts.children].forEach((c,j)=>{c.disabled=true;
        if(order[j].i===0)c.classList.add('correct');else if(j===pos)c.classList.add('wrong');else c.classList.add('dim');});
      onAnswer(ok,e.clientX,e.clientY,card);onScore&&onScore(ok);
      const why=el('div','why','<h5>'+(ok?'Why this is right →':'Why the answer is what it is →')+'</h5><p>'+Q.why+'</p>');
      box.appendChild(why);requestAnimationFrame(()=>why.classList.add('show'));
    };
    opts.appendChild(b);});
  return box;
}

let quizState=null;
/* SCOPE — which questions this attempt covers.
   FOCUS = a single topic id (sidebar click), null = the full paper.
   MISSED = questions got wrong on the last attempt, for the retry drill. */
let FOCUS=null, ACTIVE=QUIZ.slice(), MISSED=[];
let TRAPS=ACTIVE.filter(q=>q.trap).length;
function setScope(mode,id){
  if(mode==='topic'){FOCUS=id; ACTIVE=QUIZ.filter(q=>q.t===id);}
  else if(mode==='missed'&&MISSED.length){FOCUS=null; ACTIVE=MISSED.slice();}
  else {FOCUS=null; ACTIVE=QUIZ.slice();}
  TRAPS=ACTIVE.filter(q=>q.trap).length;

  window.scrollTo({top:0,behavior:reduced?'auto':'smooth'});
}
