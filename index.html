<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketing Management · Quiz II</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070B1A; --cyan:#22D3EE; --violet:#8B5CF6; --pink:#F472B6;
  --lime:#4ADE80; --red:#FB7185; --gold:#FBBF24;
  --grad:linear-gradient(100deg,#22D3EE,#8B5CF6,#F472B6);
  --glass:rgba(255,255,255,.05); --glass-brd:rgba(255,255,255,.12);
  --ink:#E7ECFF; --muted:#9AA6C9; --spring:cubic-bezier(.22,1.4,.36,1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
.mono{font-family:'JetBrains Mono',monospace}
.bg-fx{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;animation:drift 26s var(--spring) infinite alternate}
.orb.a{width:520px;height:520px;background:#1e3a8a;top:-160px;left:-120px}
.orb.b{width:460px;height:460px;background:#6d28d9;bottom:-180px;right:-100px;animation-duration:32s}
.orb.c{width:380px;height:380px;background:#0e7490;top:40%;left:55%;animation-duration:29s}
.orb.d{width:300px;height:300px;background:#be185d;top:12%;right:18%;animation-duration:35s;opacity:.35}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(60px,50px) scale(1.15)}}
.grid-fx{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:linear-gradient(rgba(139,92,246,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(139,92,246,.09) 1px,transparent 1px);
  background-size:46px 46px;-webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.7),transparent 60%);mask-image:linear-gradient(to bottom,rgba(0,0,0,.7),transparent 60%)}
/* ===== header w/ game HUD ===== */
header{position:sticky;top:0;z-index:50;padding:2px;margin:12px;border-radius:20px;background:var(--grad);background-size:300% 300%;animation:flow 8s linear infinite}
@keyframes flow{to{background-position:300% 0}}
.hdr-in{background:rgba(9,13,28,.88);backdrop-filter:blur(14px);border-radius:18px;padding:12px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.1;min-width:180px}
.brand .k{font-size:11px;letter-spacing:.26em;color:var(--cyan);font-weight:600}
.brand .t{font-size:18px;font-weight:700}
.brand .s{font-size:11px;color:var(--muted)}
.hud{margin-left:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.lvl{display:flex;flex-direction:column;gap:3px;min-width:170px}
.lvl .top{display:flex;justify-content:space-between;font-size:11px}
.lvl .top .ti{font-weight:700;color:#fff}
.lvl .top .xp{font-family:'JetBrains Mono',monospace;color:var(--gold)}
.lvl .bar{height:8px;border-radius:8px;background:rgba(255,255,255,.09);overflow:hidden}
.lvl .bar i{display:block;height:100%;width:0;border-radius:8px;background:var(--grad);background-size:200% 100%;animation:shim 2.5s linear infinite;transition:width .6s var(--spring)}
@keyframes shim{to{background-position:200% 0}}
.chip{display:flex;align-items:center;gap:6px;background:var(--glass);border:1px solid var(--glass-brd);border-radius:12px;padding:7px 12px;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;transition:.3s}
.chip.streak{color:var(--gold)}
.chip.streak.t1{border-color:rgba(251,191,36,.45);box-shadow:0 0 14px rgba(251,191,36,.22)}
.chip.streak.t2{border-color:rgba(251,146,60,.7);box-shadow:0 0 20px rgba(251,146,60,.38);color:#FDBA74}
.chip.streak.t3{border-color:rgba(244,114,182,.85);box-shadow:0 0 28px rgba(244,114,182,.5);color:#FBCFE8;animation:pulseHot 1.1s ease-in-out infinite alternate}
@keyframes pulseHot{to{transform:scale(1.07)}}
.chip.badge,.chip.snd{cursor:pointer}
.chip.badge{color:var(--cyan)}
.chip.snd{color:var(--pink)}
.chip.cmap{color:var(--lime);cursor:pointer}
.chip.cmap:hover{border-color:rgba(74,222,128,.6)}
.chip.snd.off{color:var(--muted);opacity:.65}
.chip .lab{font-size:10px;letter-spacing:.12em;color:var(--muted);font-family:'Space Grotesk',sans-serif;font-weight:600}
/* ===== layout ===== */
.wrap{display:grid;grid-template-columns:290px 1fr;gap:20px;padding:6px 18px 96px;max-width:1320px;margin:0 auto}
aside{position:sticky;top:104px;align-self:start;max-height:calc(100vh - 124px);overflow-y:auto;padding-right:4px}
aside::-webkit-scrollbar{width:6px}aside::-webkit-scrollbar-thumb{background:rgba(139,92,246,.4);border-radius:6px}
.side-h{font-size:11px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin:4px 0 10px 6px}
.pbar{height:8px;border-radius:8px;background:rgba(255,255,255,.07);overflow:hidden;margin:0 6px 16px}
.pbar i{display:block;height:100%;width:0;border-radius:8px;background:var(--grad);background-size:200% 100%;animation:shim 2.5s linear infinite;transition:width .6s var(--spring)}
.topic{display:flex;align-items:center;gap:10px;padding:11px 12px;margin-bottom:7px;border-radius:13px;background:var(--glass);border:1px solid transparent;cursor:pointer;transition:.25s;font-size:13.5px}
.topic:hover{border-color:var(--glass-brd);transform:translateX(3px)}
.topic .idx{width:24px;height:24px;flex:0 0 24px;border-radius:8px;display:grid;place-items:center;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;background:rgba(255,255,255,.08);color:var(--muted)}
.topic.done .idx{background:var(--grad);color:#08111f}
.topic .nm{flex:1;line-height:1.2;display:flex;flex-direction:column;gap:2px;min-width:0}
.topic .nm small{font-size:10.5px;color:var(--muted);font-family:'JetBrains Mono',monospace}
.topic .flame{font-style:normal;font-size:12px}
.topic .sc{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--cyan)}
.topic.done{border-color:rgba(74,222,128,.34)}
.topic.hot{border-color:rgba(251,191,36,.3)}
main{min-width:0}
.card{background:var(--glass);border:1px solid var(--glass-brd);border-radius:20px;padding:26px 28px;backdrop-filter:blur(10px);margin-bottom:18px;animation:popIn .5s var(--spring) both}
@keyframes popIn{from{opacity:0;transform:translateY(22px) scale(.96)}to{opacity:1;transform:none}}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--cyan);font-weight:600;margin-bottom:6px}
h1.tt{font-size:26px;margin:0 0 4px;font-weight:700}
.sub{color:var(--muted);font-size:14px;line-height:1.6}
.sub b{color:#D6DDF7}
.srcrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.src{font-family:'JetBrains Mono',monospace;font-size:11px;padding:5px 11px;border-radius:999px;background:rgba(139,92,246,.14);border:1px solid rgba(139,92,246,.45);color:#d6ccff}
.watch{margin-top:14px;background:rgba(251,113,133,.09);border:1px solid rgba(251,113,133,.45);border-left:4px solid var(--red);border-radius:12px;padding:14px 16px}
.watch h5{margin:0 0 4px;color:var(--red);font-size:14px} .watch p{margin:0;font-size:13.5px;color:#ffd9e0;line-height:1.5}
/* ===== buttons / mcq ===== */
.btn{border:0;font-family:inherit;font-weight:600;cursor:pointer;border-radius:12px;transition:.25s;font-size:14px}
.btn-grad{background:var(--grad);background-size:200% auto;color:#08111f;padding:12px 24px;box-shadow:0 6px 24px rgba(139,92,246,.35)}
.btn-grad:hover{background-position:100% center;transform:translateY(-2px)}
.btn-ghost{background:rgba(255,255,255,.06);border:1px solid var(--glass-brd);color:var(--ink);padding:11px 20px}
.btn-ghost:hover{border-color:var(--cyan);color:#fff}
.row-btns{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:20px}
.mcq{margin-top:8px}.mcq .q{font-size:16px;font-weight:600;margin-bottom:8px;line-height:1.5}
.mcq .q b{color:#fff}
.givens{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 10px}
.givens span{font-family:'JetBrains Mono',monospace;font-size:11.5px;padding:4px 9px;border-radius:8px;background:rgba(34,211,238,.09);border:1px solid rgba(34,211,238,.28);color:#bfe9f4}
.tag{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.05em;padding:3px 10px;border-radius:999px;margin:0 6px 10px 0}
.tag.concept{background:rgba(34,211,238,.14);color:var(--cyan);border:1px solid rgba(34,211,238,.4)}
.tag.apply{background:rgba(251,191,36,.14);color:var(--gold);border:1px solid rgba(251,191,36,.4)}
.tag.calc{background:rgba(74,222,128,.14);color:var(--lime);border:1px solid rgba(74,222,128,.45)}
.tag.case{background:rgba(244,114,182,.16);color:var(--pink);border:1px solid rgba(244,114,182,.5)}
.tag.easy{background:rgba(74,222,128,.13);color:var(--lime)}.tag.medium{background:rgba(251,191,36,.13);color:var(--gold)}.tag.hard{background:rgba(251,113,133,.13);color:var(--red)}
.tag.trap{background:rgba(139,92,246,.2);color:#ddd0ff;border:1px solid rgba(139,92,246,.6);animation:trapGlow 2.2s ease-in-out infinite alternate}
@keyframes trapGlow{to{box-shadow:0 0 14px rgba(139,92,246,.55)}}
.opts{display:grid;gap:10px;margin-top:6px}
.opt{text-align:left;background:rgba(255,255,255,.04);border:1px solid var(--glass-brd);border-radius:12px;padding:14px 16px;cursor:pointer;font-family:inherit;font-size:14.5px;color:var(--ink);transition:.18s;position:relative;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--cyan);transform:translateX(3px)}.opt:disabled{cursor:default}
.opt .lt{font-family:'JetBrains Mono',monospace;color:var(--violet);font-weight:700;margin-right:10px}
.opt.correct{border-color:var(--lime);background:rgba(74,222,128,.16);box-shadow:0 0 34px rgba(74,222,128,.4);animation:popBig .6s var(--spring)}
.opt.wrong{border-color:var(--red);background:rgba(251,113,133,.2);box-shadow:0 0 34px rgba(251,113,133,.4);animation:shakeHard .55s}.opt.dim{opacity:.32}
@keyframes popBig{0%{transform:scale(1)}30%{transform:scale(1.075)}55%{transform:scale(.99)}75%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes shakeHard{0%,100%{transform:translateX(0) rotate(0)}12%{transform:translateX(-14px) rotate(-1.4deg)}26%{transform:translateX(14px) rotate(1.4deg)}42%{transform:translateX(-11px) rotate(-1deg)}58%{transform:translateX(11px) rotate(1deg)}74%{transform:translateX(-6px)}88%{transform:translateX(6px)}}
.why{margin-top:14px;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.4);border-radius:12px;padding:14px 16px;opacity:0;transform:translateY(8px);transition:.4s;max-height:0;overflow:hidden}
.why.show{opacity:1;transform:none;max-height:900px}
.why h5{margin:0 0 4px;color:var(--gold);font-size:13px}.why p{margin:0 0 8px;font-size:13.5px;color:#ffeec4;line-height:1.6}
.why p:last-child{margin-bottom:0}
.why .work{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:#ffe0a3;background:rgba(0,0,0,.28);border-radius:8px;padding:9px 11px;margin:8px 0;line-height:1.7;overflow-x:auto;white-space:pre-wrap}
.floater{position:fixed;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:28px;pointer-events:none;z-index:999;text-shadow:0 3px 14px rgba(0,0,0,.6);animation:rise 1.25s var(--spring) forwards}
@keyframes rise{from{opacity:1;transform:translateY(0) scale(.6)}to{opacity:0;transform:translateY(-110px) scale(1.6)}}
/* ===== BIG REACTION TEXT ===== */
.bigcall{position:fixed;left:50%;top:26%;transform:translateX(-50%);z-index:1000;pointer-events:none;font-weight:700;
  font-size:clamp(38px,9vw,86px);letter-spacing:-.01em;text-align:center;white-space:nowrap;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:callIn 1.6s var(--spring) forwards;filter:drop-shadow(0 0 32px rgba(139,92,246,.75))}
.bigcall.bad{background:linear-gradient(100deg,#FB7185,#F43F5E,#FDA4AF);-webkit-background-clip:text;background-clip:text;
  filter:drop-shadow(0 0 34px rgba(251,113,133,.8));animation:callBad 1.5s cubic-bezier(.2,1.3,.4,1) forwards}
@keyframes callIn{0%{opacity:0;transform:translateX(-50%) scale(.25) rotate(-9deg)}
  18%{opacity:1;transform:translateX(-50%) scale(1.28) rotate(3deg)}
  32%{transform:translateX(-50%) scale(1) rotate(-1.5deg)}
  44%{transform:translateX(-50%) scale(1.1) rotate(0deg)}
  80%{opacity:1;transform:translateX(-50%) scale(1.02)}
  100%{opacity:0;transform:translateX(-50%) scale(1.14) translateY(-46px)}}
@keyframes callBad{0%{opacity:0;transform:translateX(-50%) scale(2.2) rotate(6deg)}
  16%{opacity:1;transform:translateX(-50%) scale(.9) rotate(-4deg)}
  26%{transform:translateX(-50%) scale(1.12) rotate(3deg)}
  38%{transform:translateX(-50%) scale(.98) rotate(-2deg)}
  50%{transform:translateX(-50%) scale(1.04) rotate(0deg)}
  82%{opacity:1}
  100%{opacity:0;transform:translateX(-50%) scale(.86) translateY(34px)}}
/* ===== GIANT STAMPS — the exaggerated reaction ===== */
.mega{position:fixed;left:50%;top:47%;z-index:999;pointer-events:none;user-select:none;line-height:1;
  font-size:clamp(150px,33vw,330px);filter:drop-shadow(0 22px 48px rgba(0,0,0,.75))}
.mega.down{animation:megaDown 1.5s cubic-bezier(.18,.85,.3,1) forwards}
@keyframes megaDown{
  0%{opacity:0;transform:translate(-50%,-160%) scale(.35) rotate(-42deg)}
  15%{opacity:1;transform:translate(-50%,-50%) scale(1.42) rotate(9deg)}
  25%{transform:translate(-50%,-50%) scale(1.02) rotate(-7deg)}
  36%{transform:translate(-50%,-50%) scale(1.24) rotate(5deg)}
  47%{transform:translate(-50%,-50%) scale(1.08) rotate(-3deg)}
  58%{transform:translate(-50%,-50%) scale(1.15) rotate(0deg)}
  78%{opacity:.95;transform:translate(-50%,-50%) scale(1.12)}
  100%{opacity:0;transform:translate(-50%,26%) scale(.82) rotate(17deg)}}
.mega.up{animation:megaUp 1.25s cubic-bezier(.2,1.35,.35,1) forwards}
@keyframes megaUp{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.15) rotate(-16deg)}
  20%{opacity:1;transform:translate(-50%,-50%) scale(1.3) rotate(7deg)}
  34%{transform:translate(-50%,-50%) scale(1) rotate(-4deg)}
  48%{transform:translate(-50%,-50%) scale(1.14) rotate(0deg)}
  72%{opacity:.9}
  100%{opacity:0;transform:translate(-50%,-130%) scale(1.3) rotate(6deg)}}
/* ===== flashes / vignettes ===== */
.flash{position:fixed;inset:0;z-index:997;pointer-events:none;background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.34),transparent 62%);animation:flashF .55s ease-out forwards}
@keyframes flashF{to{opacity:0}}
.greenflash{position:fixed;inset:0;z-index:996;pointer-events:none;background:radial-gradient(circle at 50% 45%,rgba(74,222,128,.30),transparent 64%);animation:flashF .6s ease-out forwards}
.redflash{position:fixed;inset:0;z-index:996;pointer-events:none;background:radial-gradient(circle at 50% 45%,rgba(251,113,133,.34),transparent 58%);animation:flashF .7s ease-out forwards}
.vignette{position:fixed;inset:0;z-index:996;pointer-events:none;box-shadow:inset 0 0 190px 60px rgba(244,63,94,.75);animation:vig .95s ease-out forwards}
@keyframes vig{0%{opacity:0}14%{opacity:1}100%{opacity:0}}
.vignette.good{box-shadow:inset 0 0 180px 54px rgba(74,222,128,.62);animation-duration:.85s}
.shakeit{animation:bodyShake .48s}
@keyframes bodyShake{0%,100%{transform:translate(0,0)}12%{transform:translate(-13px,4px) rotate(-.5deg)}26%{transform:translate(13px,-4px) rotate(.5deg)}40%{transform:translate(-10px,3px)}54%{transform:translate(10px,-3px)}68%{transform:translate(-6px,2px)}84%{transform:translate(6px,-2px)}}
.zoomit{animation:bodyZoom .5s var(--spring)}
@keyframes bodyZoom{0%,100%{transform:scale(1)}35%{transform:scale(1.014)}}
/* ===== crackers ===== */
.spark{position:fixed;z-index:998;pointer-events:none;animation:crkX var(--d) linear forwards}
.spark i{display:block;border-radius:50%;animation:crkY var(--d) cubic-bezier(.14,.72,.36,1) forwards, crkF var(--d) ease-in forwards}
@keyframes crkX{from{transform:translateX(0)}to{transform:translateX(var(--tx))}}
@keyframes crkY{0%{transform:translateY(0)}58%{transform:translateY(var(--ty))}100%{transform:translateY(calc(var(--ty) + 96px))}}
@keyframes crkF{0%,55%{opacity:1}100%{opacity:0}}
.boom{position:fixed;z-index:998;pointer-events:none;border:3px solid #fff;border-radius:50%;margin:0;animation:crkR .68s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes crkR{from{transform:translate(-50%,-50%) scale(.05);opacity:.98}to{transform:translate(-50%,-50%) scale(1);opacity:0}}
.rocket{position:fixed;z-index:998;pointer-events:none;width:4px;height:16px;border-radius:3px;margin-left:-2px;animation:crkL var(--rd) cubic-bezier(.25,.5,.4,1) forwards}
@keyframes crkL{from{transform:translateY(0) scaleY(1.35);opacity:.15}60%{opacity:1}to{transform:translateY(var(--ry)) scaleY(.7);opacity:.85}}
/* ===== thumbs — the shower ===== */
.tdown{position:fixed;z-index:998;pointer-events:none;user-select:none;line-height:1;filter:drop-shadow(0 3px 9px rgba(0,0,0,.6))}
.tdown.pop{animation:tdPop var(--d) cubic-bezier(.2,.7,.35,1) forwards}
@keyframes tdPop{0%{opacity:0;transform:translate(0,0) rotate(0deg) scale(.25)}
  12%{opacity:1}
  100%{opacity:0;transform:translate(var(--tx),var(--ty)) rotate(var(--rot)) scale(1.25)}}
.tdown.rain{animation:tdRain var(--d) linear forwards}
@keyframes tdRain{0%{opacity:0;transform:translateY(-40px) rotate(0deg)}
  9%{opacity:1}
  86%{opacity:1}
  100%{opacity:0;transform:translateY(var(--ty)) rotate(var(--rot))}}
.confetti{position:fixed;width:11px;height:15px;top:-20px;z-index:998;pointer-events:none;border-radius:2px}
/* ===== toast ===== */
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-160px);z-index:1001;background:rgba(9,13,28,.95);border:1px solid var(--gold);border-radius:14px;padding:12px 20px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.5);transition:transform .5s var(--spring);max-width:92vw}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast .em{font-size:26px}.toast .tt{font-weight:700}.toast .td{font-size:12px;color:var(--muted)}
/* ===== quiz ===== */
.qgroup-h{display:flex;align-items:center;gap:12px;margin:26px 2px 12px;scroll-margin-top:110px}
.qgroup-h .gi{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-family:'JetBrains Mono',monospace;font-weight:700;background:var(--grad);color:#08111f;font-size:13px}
.qgroup-h .gt{font-size:17px;font-weight:700}.qgroup-h .gc{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted)}
.qcard{background:var(--glass);border:1px solid var(--glass-brd);border-radius:16px;padding:20px 22px;margin-bottom:14px;backdrop-filter:blur(8px);transition:box-shadow .35s,border-color .35s}
.qcard.hitgood{border-color:rgba(74,222,128,.55);box-shadow:0 0 40px rgba(74,222,128,.22)}
.qcard.hitbad{border-color:rgba(251,113,133,.55);box-shadow:0 0 40px rgba(251,113,133,.22)}
.qnum{font-family:'JetBrains Mono',monospace;color:var(--muted);font-size:12px;margin-bottom:6px;display:flex;gap:10px;align-items:center}
.footbar{position:fixed;bottom:0;left:0;right:0;z-index:60;padding:10px 18px;background:rgba(9,13,28,.92);backdrop-filter:blur(14px);border-top:1px solid var(--glass-brd);display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.footbar .fp{flex:1;min-width:160px;display:flex;flex-direction:column;gap:5px}
.footbar .fp .lbl{font-size:12px;color:var(--muted);font-family:'JetBrains Mono',monospace}
.footbar .fp .bar{height:7px;border-radius:7px;background:rgba(255,255,255,.08);overflow:hidden}
.footbar .fp .bar i{display:block;height:100%;width:0;border-radius:7px;background:var(--grad);transition:width .5s var(--spring)}
.ring-wrap{display:flex;gap:30px;align-items:center;flex-wrap:wrap;justify-content:center}
.ring{position:relative;width:200px;height:200px}.ring svg{transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .mid .big{font-size:44px;font-weight:700;font-family:'JetBrains Mono',monospace;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.ring .mid .sm{font-size:12px;color:var(--muted);letter-spacing:.1em}
.grade{font-size:24px;font-weight:700;margin:4px 0}
.meters{margin-top:24px;display:grid;gap:12px}

<script>
/* =========================================================================
   MARKETING MANAGEMENT — QUIZ II
   Source: MM101 Sessions 8-12 — the material after Quiz I.
           Sessions 8-9  Brand, and the 6P marketing mix (Surf excel worked
                         through in full); Proposition; the four levels of
                         Product; Price and RPI; Packaging.
           Session 10    Product Mix — features / performance / design,
                         blind tests, product hierarchy, demand spaces.
           Sessions 11-12 Pack-Price Architecture — the price ladder, pack
                         profitability, SOR, recruit & uptrade, shopper
                         missions, channels.
   Sessions 1-6 (5 Cs, segmentation, targeting, positioning) were the ground
   Quiz I covered, so they are referenced in the Why panels rather than
   re-tested here.
   Level is deliberately low-to-moderate, matching the Quiz I paper.
   The correct option is always authored FIRST in `opts`; positions are
   reshuffled on every attempt.
   ========================================================================= */

const $=s=>document.querySelector(s), el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const rnd=a=>a[Math.floor(Math.random()*a.length)];

/* ---------------- topics ---------------- */
const TOPICS=[
 {id:'brand', name:'Brand & the 6P Mix',      kick:'what a brand is · marketing mix'},
 {id:'mix',   name:'Proposition, Product, Price', kick:'product levels · RPI', hot:true},
 {id:'pmix',  name:'Product Mix',             kick:'quality · demand spaces'},
 {id:'pack',  name:'Pack-Price Architecture', kick:'price ladder · recruit & uptrade', hot:true},
];

/* ---------------- the quiz ----------------
   t=topic, tag=concept|apply|case|calc, diff, trap=true (marked tricky),
   given=[chips], q=stem, opts=[correct, ...distractors], why=explanation
   Correct option is always authored FIRST; positions reshuffle every attempt. */
const QUIZ=[

/* ============ 01 · BRAND & THE 6P MIX ============ */
{t:'brand',tag:'concept',diff:'easy',
 q:'Session 8 quotes <b>Keller (1998)</b> on what a brand is. Which is that definition?',
 opts:['A set of mental associations held by the consumer, which add to the perceived value of the product or service',
       'The registered name, logo and trademark that legally protect a product from being copied',
       'The total a company has spent on advertising over the years, accumulated as goodwill',
       'The physical product together with its packaging — everything the consumer actually receives'],
 why:'The deck gives <b>two</b> definitions and they do different jobs. The first is structural — a brand is <i>“a sign or set of signs certifying the origin of a product or service and differentiating it from the competition”</i>. Keller’s is the one that matters for marketing: a brand is <b>a set of mental associations held by the consumer, which add to the perceived value</b>. Note where the brand lives — in the consumer’s head, not on the shelf and not in the trademark registry. That is exactly why the next slide says a <b>“name” becomes a “brand”</b> only once it has <b>meaning, saliency, differentiability and trust</b>: all four are things the consumer has to hold, not things the company can file for.'},

{t:'brand',tag:'concept',diff:'easy',
 q:'The deck says a <b>“name” becomes a “brand”</b> only when it acquires four things. Which four?',
 opts:['Meaning, saliency, differentiability and trust',
       'A logo, a tagline, a jingle and a mascot',
       'Awareness, distribution, a price premium and market share',
       'A trademark, a patent, a domain name and a social media handle'],
 why:'<b>Meaning</b> — the name stands for something. <b>Saliency</b> — it comes to mind in the category. <b>Differentiability</b> — it is not interchangeable with the next name on the shelf. <b>Trust</b> — the consumer believes it will deliver. The other three options are all <i>assets or outcomes</i> a brand may have; none of them is what turns a name into a brand. A logo and a jingle are identity devices, share and distribution are results, and a trademark is a legal registration — a company can own every one of those and still have a name nobody attaches meaning to. Tie this back to the brand’s biggest challenge, which the deck poses right after: staying differentiated when the category’s products converge.'},

{t:'brand',tag:'concept',diff:'easy',trap:true,
 q:'The course works with a <b>6P</b> marketing mix, not the classic 4Ps. Which set is the course’s six?',
 opts:['Product, Price, Place, Promotion, Packaging, Proposition',
       'Product, Price, Place, Promotion, Positioning, Profit',
       'Product, Price, Place, Promotion, People, Process',
       'Product, Price, Packaging, Promotion, People, Physical evidence'],
 why:'The classic four — Product, Price, Place, Promotion — plus <b>Packaging</b> and <b>Proposition</b>. Two traps to clear:<div class="work">Positioning  ≠ a P  → it sits upstream, in STP\nProposition  = a P  → what the brand stands for, in the mix\nPeople / Process / Physical evidence → the 7P services\n                    extension, not this course’s frame</div>The Positioning/Proposition confusion is the one to watch. <b>Positioning</b> is the STP decision — the unique value you choose to offer a defined target. <b>Proposition</b> is the mix element that carries that decision into execution: what the brand wants to stand for in the consumer’s mind. Also note the Marketing Management Process diagram in every deck — the 6Ps box sits <i>below</i> the STP box, because the mix executes what STP decided.'},

{t:'brand',tag:'concept',diff:'easy',
 q:'The deck calls a brand’s marketing mix its <b>“DNA”</b>. What does that mean?',
 opts:['Every brand makes its own distinct set of choices across the six Ps, and that combination is what makes it recognisably itself',
       'The mix is fixed at launch and cannot be changed later without relaunching the brand',
       'The mix is inherited from the parent company, so every brand in a portfolio runs the same mix',
       'DNA refers to the brand’s legal identity — its name, logo and trademark registrations'],
 why:'“Each brand has its unique DNA — a brand’s unique approach across the 6Ps is called the <b>Marketing Mix</b>.” Two brands can sell chemically similar detergent and still be unmistakably different, because they answer the six questions differently. It is a set of <i>choices</i>, so it can be changed — but the deck’s closing slide adds the constraint: <b>the elements of the mix are inter-related</b>. Move one and the others have to move with it. Take a premium price without a product, pack and promotion that justify it and the mix stops hanging together — the same misalignment failure Quiz I tested between Positioning and the 6Ps.'},

{t:'brand',tag:'case',diff:'medium',trap:true,
 q:'Surf excel’s mix is laid out in full in the deck. <b>“Daag Achhe Hain — if you get dirty in the act of doing good, then dirt is good”</b> belongs to which P?',
 opts:['Proposition — what the brand wants to stand for in the consumer’s mind',
       'Promotion — the line runs on TV, print, outdoor and digital, so it is a promotion asset',
       'Product — it describes what the detergent does to dirt',
       'Packaging — the line is printed on the pack'],
 why:'The deck’s Surf excel summary, row by row:<div class="work">Product      spray-dried or mixed detergent,\n             in powder or liquid form\nPlace        any store that sells the category\nPrice        premium, around 120–200 RPI\nPackaging    sustainable sachets, pouches, plastic bottles\nPromotion    TV, print, outdoor and digital\nProposition  Daag Achhe Hain</div>The trap is Promotion. Promotion is the <b>carrier</b> — the media the message travels through. Proposition is the <b>idea being carried</b>: the thing the brand wants to own in the consumer’s head. “Daag Achhe Hain” would still be Surf excel’s proposition if it never bought a single TV spot. Useful test: if you changed the media plan entirely, would this line change? No — so it is not Promotion.'},

/* ============ 02 · PROPOSITION, PRODUCT, PRICE ============ */
{t:'mix',tag:'concept',diff:'easy',
 q:'How does Session 8 define <b>Proposition</b>?',
 opts:['What a brand wants to stand for in the minds of the consumer',
       'The discount or offer a brand puts in front of a shopper to close the sale',
       'The specification sheet of the product — its ingredients, size and claims',
       'The revenue the brand proposes to earn over the financial year'],
 why:'One line, worth memorising: <b>“Proposition: what a brand wants to stand for in the minds of the consumer.”</b> Two things follow. First, it is about a <i>mind</i>, not a shelf — like Keller’s definition of a brand, it is a mental association. Second, Session 10 opens by pairing it with Product: <b>the proposition is the promise of value, the product is the proof of that promise.</b> That pairing is the reason the six Ps have to hang together — a proposition with no product to back it is a claim the consumer will eventually test and reject.'},

{t:'mix',tag:'apply',diff:'medium',
 q:'The deck works the four levels of Product through a protein bar. <b>“More flavours and a higher protein density”</b> — things not on sale yet — is which level?',
 opts:['Potential product','Expected product','Generic product','Core product'],
 why:'The four levels run from the abstract to the not-yet-built:<div class="work">Core       the protein bar itself — the basic need served\nGeneric    a bar with no added sugar, made with cocoa,\n           dates, cashews, almonds — what is actually sold\nExpected   a bar that will help you gain muscle mass —\n           what the buyer assumes she is getting\nPotential  more flavours, higher protein density —\n           what it could become</div>So the order is <b>Core → Generic → Expected → Potential</b>. Anything described as future headroom — a variant, a format, a benefit not yet delivered — is the <b>Potential</b> product. Note the difference between Generic and Expected: Generic is the physical specification you ship; Expected is the benefit the consumer takes for granted, whether or not you spelled it out.'},

{t:'mix',tag:'calc',diff:'medium',
 q:'Three brands compete in a category, all selling the same pack size. Using <b>RPI = Σ (market share × brand price)</b> as the category benchmark, roughly what is <b>Brand A’s RPI</b>?',
 given:['A · price ₹100 · sales 100','B · price ₹200 · sales 200','C · price ₹200 · sales 700'],
 opts:['About 53 — A sells at roughly half the category’s average price',
       'About 60 — A sells at roughly three-fifths of the category’s average price',
       'About 100 — A is priced at the category average',
       'About 190 — A is a premium brand'],
 why:'Market shares come from sales, not from the number of brands. Total sales = 1,000.<div class="work">Shares:  A 100/1000 = 10%\n         B 200/1000 = 20%\n         C 700/1000 = 70%\n\nCategory average price\n  = 0.10×100 + 0.20×200 + 0.70×200\n  = 10 + 40 + 140  = ₹190\n\nRPI(A) = 100 / 190 = 0.53  →  53</div>Read it as: <b>A sells at 53% of what the average rupee in this category pays.</b> RPI 100 means priced exactly at the category average — which is why Surf excel’s “120–200 RPI” marks it as premium, at 1.2–2× the average.<br><br>The <b>60</b> answer is the trap: it comes from averaging the three prices unweighted, (100+200+200)/3 = ₹167. That is wrong because C alone is 70% of the market — the average price a consumer actually pays has to be dominated by C, not given the same weight as A.'},

{t:'mix',tag:'calc',diff:'medium',trap:true,
 q:'You are comparing your shampoo’s pricing to the competitor’s. What must you do <b>before</b> any RPI number means anything?',
 given:['Yours · 180 ml ₹10 · 400 ml ₹20 · 1000 ml ₹50','Competitor · 200 ml ₹20 · 500 ml ₹40 · 1000 ml ₹100'],
 opts:['Convert every pack to a price per ml — on that basis you sit at roughly half the competitor’s price, so you are the value brand',
       'Nothing — compare the pack prices directly; ₹10 against ₹20 already tells you that you are cheaper',
       'Compare only the 1000 ml packs, since that is the one size both brands share',
       'Convert to price per pack sold, since shoppers buy packs and not millilitres'],
 why:'Price is only comparable once grammage is stripped out:<div class="work">Yours        10/180  = ₹0.056 /ml\n             20/400  = ₹0.050 /ml\n             50/1000 = ₹0.050 /ml\n\nCompetitor   20/200  = ₹0.100 /ml\n             40/500  = ₹0.080 /ml\n            100/1000 = ₹0.100 /ml</div>About <b>₹0.05 against ₹0.09</b> — you are roughly half, an RPI in the 50s. The deck makes the identical point with its second RPI table, where brand B at ₹200 for 500 ml (₹0.40/ml) is <i>four times</i> brand A at ₹100 for 1000 ml (₹0.10/ml), even though the headline prices are only 2× apart.<br><br>Comparing only the 1000 ml packs happens to give the same “half” here, but it is still the wrong method: it throws away most of the range, and it collapses the moment either brand changes its size line-up — which is precisely what a pack-price architecture is designed to do.'},

{t:'mix',tag:'apply',diff:'easy',
 q:'The deck records Surf excel’s price as <b>“premium at around 120–200 RPI”</b>. What does an RPI of 150 tell you?',
 opts:['The brand sells at about 1.5× the category’s share-weighted average price per unit',
       'The brand earns a 150% profit margin on every pack it sells',
       'The brand is 150% more expensive than the cheapest brand in the category',
       'The brand holds 150 index points of market share against a base year of 100'],
 why:'RPI is a <b>relative price index</b>: the brand’s price per unit divided by the category’s share-weighted average price per unit, ×100.<div class="work">RPI  100  priced at the category average\nRPI &lt;100  value / discount end\nRPI &gt;100  premium — 150 means 1.5× the average</div>Two things it is not. It says nothing about <b>margin</b> — a brand can carry a 150 RPI on a thin margin if its costs are high. And the benchmark is the <b>average</b>, not the cheapest brand in the category. The reason the average is share-weighted rather than a simple mean is the same reason as in the previous question: what you want is the price the typical rupee in the category actually pays.'},

{t:'mix',tag:'concept',diff:'easy',
 q:'Session 9 says packaging <b>“brings the purpose alive”</b>. Which three jobs does the deck give it?',
 opts:['Impulse driver, clutter breaking, and smoothing the rough edges of the experience',
       'Cost reduction, shelf-life extension and transport efficiency',
       'Legal compliance, ingredient disclosure and barcode scanning',
       'Trademark protection, anti-counterfeiting and serialisation'],
 why:'<b>Impulse driver</b> — the pack itself triggers an unplanned purchase. <b>Clutter breaking</b> — it gets seen in a shelf full of near-identical competitors. <b>Smoothen the rough edges</b> — it fixes the friction in using the product (the spout that does not drip, the resealable pack, the pump). All three are <i>marketing</i> jobs, which is exactly why Packaging is promoted to a full P here rather than being filed under Product.<br><br>The deck separates pack decisions into two vectors — <b>design considerations</b> (how it looks) and <b>functional considerations</b> (how it works). The distractors here are all real concerns of a packaging team; they are just supply-chain, legal and security concerns, not the marketing purpose the deck is naming.'},

/* ============ 03 · PRODUCT MIX ============ */
{t:'pmix',tag:'concept',diff:'easy',
 q:'Session 10 opens by fixing the relationship between two of the Ps. Which is it?',
 opts:['Proposition is the promise of value a brand makes; Product is the proof of that promise',
       'Product is the promise of value; Proposition is the proof, delivered through advertising',
       'Proposition and Product are two names for the same thing at different stages of the funnel',
       'Product is the promise made to the retailer; Proposition is the promise made to the consumer'],
 why:'<b>“Proposition is the promise of value that a brand provides. Product is the proof of that promise.”</b> The direction matters. A proposition can be written in an afternoon; the product is what has to survive contact with a consumer who tries it. This is the mechanism behind “the elements of the mix are inter-related” — if the proposition promises what the product cannot deliver, the mix does not just look inconsistent, it actively destroys the trust that made the name a brand in the first place.'},

{t:'pmix',tag:'concept',diff:'easy',
 q:'The deck says several things together determine a product’s <b>quality</b>. Which set does it use?',
 opts:['Features — which attributes it delivers; Performance — whether it delivers them consistently; Design — its look, feel and usability',
       'Price, packaging and promotion',
       'Durability, warranty and after-sales service',
       'Ingredients, manufacturing process and certification'],
 why:'Three parameters, each answering a different question:<div class="work">Features     Which attributes does the product deliver on?\nPerformance  Does it deliver on them consistently?\nDesign       How is the look / feel / usability?</div>And the point of naming them is competitive: <b>you want a “win” on these versus competition</b> — not a win in the abstract. Note that the deck is talking about the product itself here, so price, packaging and promotion are deliberately outside the frame; they are other Ps. Durability and warranty sit inside Performance rather than beside it.'},

{t:'pmix',tag:'concept',diff:'medium',
 q:'The deck says <b>performance quality</b> is measured in exactly two ways. Which two?',
 opts:['Stability — it does not change over time; and defect-free — a low defect rate',
       'Speed of delivery and cost per unit',
       'Consumer ratings and repeat purchase rate',
       'Blind-test win rate and market share'],
 why:'<b>Stability</b> — the product does not change over time, so the bar you buy in December performs like the one you bought in June. <b>Defect-free</b> — a low defect rate across units. Both are about <i>consistency</i>, which is what separates Performance from Features. Features answer “does it do the thing at all?”; Performance answers “does it do the thing every time?”<br><br>Ratings, repeat purchase and share are all downstream <i>consequences</i> of good performance quality, not measures of it — they are contaminated by price, distribution and advertising. A blind-test win, as the next question shows, measures features, not performance.'},

{t:'pmix',tag:'apply',diff:'medium',trap:true,
 q:'A detergent brand runs a blind test against the market leader on <i>cleans stains</i>, <i>odour protection</i> and <i>fragrance</i>, and wins on all three. What has it established — and what has it <b>not</b>?',
 opts:['A win on <b>features</b>, stripped of brand and pack perception — but not that consumers will prefer it once they can see whose product it is',
       'That its product is definitively better, so the brand should now start winning share automatically',
       'A win on performance quality, since a blind test is what measures stability and defect rate',
       'Its points of parity, since a blind test can only confirm the attributes every brand already delivers'],
 why:'The deck’s slide is exactly this: <b>a “win” on features can be secured in a blind test</b>, run across the three listed attributes. The word doing the work is <i>blind</i> — the test removes the brand, the pack and the price, which is what makes it a clean read on the product and, at the same time, what limits it. Everything the brand adds back in the real world is missing from the result.<br><br>Two further distinctions. Features are not automatically PODs — the deck maps them onto the positioning vocabulary, and some of the three will be <b>points of parity</b> that every detergent must clear while others are the <b>points of difference</b> you actually win on. And a single test at one moment cannot measure <b>performance</b> quality, which is stability over time plus defect rate. Hence the session’s closing line: <b>there is no such thing as a definitively better product.</b>'},

{t:'pmix',tag:'apply',diff:'medium',
 q:'A shampoo company runs separate variants for anti-dandruff, hairfall protection, hair strength, smooth hair and damage protection. In the deck’s vocabulary, these five are…',
 opts:['Demand spaces — different needs consumers bring to the same category',
       'SKUs — the same product offered at five different pack sizes',
       'Points of parity — the five things every shampoo in the category must deliver',
       'Channels — the five routes through which the shampoo reaches the shopper'],
 why:'<b>Demand spaces are the different needs of consumers</b> within a category, and the shampoo list is the deck’s own example. They are the reason a company runs <i>width</i> — more than one product in one category — despite the costs of doing so.<br><br>Keep the hierarchy straight, because the SKU answer is testing exactly that confusion:<div class="work">Company  →  Category  →  Product  →  SKU\n                        (demand      (pack size /\n                         space)       format)</div>Five variants for five different needs are five <b>products</b>. Five pack sizes of one variant are five <b>SKUs</b>. And they are not points of parity — a POP is an attribute every brand must clear to be considered at all, whereas these are deliberately <i>different</i> needs served by different products.'},

{t:'pmix',tag:'concept',diff:'medium',trap:true,
 q:'Session 10 closes with <b>“there is no such thing as a definitively better product.”</b> What is the deck’s point?',
 opts:['A product is better only relative to the attributes a chosen target values — so a product “win” means winning the attributes that matter to your segment, not every attribute',
       'All products in a category are effectively identical, so the mix should be fought out on price and promotion alone',
       'Product quality cannot really be measured, so companies should stop running blind tests',
       'The better product is always the more expensive one, because price is what signals quality'],

/* ============ 04 · PACK-PRICE ARCHITECTURE ============ */
{t:'pack',tag:'concept',diff:'easy',
 q:'Sessions 11–12 open on a three-level hierarchy that pack architecture builds out. Which is it, widest to narrowest?',
 opts:['Category → Product → SKU','SKU → Category → Product','Product → Category → SKU','Brand → Category → Demand space'],
 why:'<b>Category → Product → SKU.</b> The category holds several products, each serving a different demand space; each product is then built out into SKUs — the individual pack sizes and formats. In the deck’s diagram, Product 1 carries one SKU, Product 2 carries three and Product 3 carries two, which is the whole point: <b>pack architecture is what turns a product into something a shopper can actually buy</b>, in the size and format that suits the occasion.<br><br>This sits one level below the hierarchy in Session 10 (Company → Category → Product). Together: Company → Category → Product → SKU.'},

{t:'pack',tag:'concept',diff:'easy',
 q:'The deck says quantity increases follow a <b>price ladder</b>. What is the rule?',
 opts:['Price per unit must not rise as the pack gets bigger — each larger pack is priced at the same or a lower price per ml or gram',
       'Price per unit must rise with pack size, since larger packs cost more to make and to ship',
       'The absolute price of each pack must be exactly double the pack below it',
       'Every pack of a brand must carry the same absolute price, so shoppers are not confused'],
 why:'The deck’s ladder is four rungs, each constrained by the one above:<div class="work">Price per unit  a\nPrice per unit  b  ≤ a\nPrice per unit  c  ≤ b\nPrice per unit  d  ≤ c</div>Note this is a rule about <b>price per unit</b>, not about absolute price — the absolute price of course goes up with size. The logic is the shopper’s: if a bigger pack were dearer per ml, she has no reason to trade up, and the whole uptrade engine stops. The deck’s own example spans ₹1 for 6 ml to ₹772 for 1000 ml, and the per-unit price falls the whole way down.<br><br>Larger packs <i>can</i> absorb this because their costs behave well — which is the next question.'},

{t:'pack',tag:'calc',diff:'easy',
 q:'Three packs of the same product. Which earns the brand the highest <b>profit margin</b>?',
 given:['100 ml · revenue 100 · cost 35','400 ml · revenue 350 · cost 75','1 L · revenue 900 · cost 145'],
 opts:['The 1 L pack, at about 84%','The 400 ml pack, at about 79%','The 100 ml pack, at about 65%','All three are identical — the price ladder holds margin constant'],
 why:'<div class="work">100 ml   100 − 35  = 65   →  65%\n400 ml   350 − 75  = 275  →  79%\n1 L      900 − 145 = 755  →  84%</div>Margin climbs with pack size, and the deck shows why in the cost split. <b>Raw material scales with volume</b> (10 → 40 → 100), but <b>packaging cost barely moves</b> (15 → 20 → 25) and <b>other costs are close to flat</b> (10 → 15 → 20). Those near-fixed components get spread over ten times the volume, so cost per ml collapses even as price per ml falls down the ladder.<br><br>The last option is the one to reason past: the ladder constrains <i>price</i> per unit to fall, which on its own would <i>compress</i> margin — it is the cost curve falling faster that lets the big pack be both cheaper per ml for the shopper and more profitable for the brand.'},

{t:'pack',tag:'concept',diff:'medium',
 q:'Beyond profitability, what is the second reason the deck gives for moving consumers into larger packs?',
 opts:['Sales growth through a higher Share of Requirement — a big pack locks the household in for longer, so competitors get fewer chances to be bought',
       'Larger packs are cheaper to advertise, since one campaign covers every size',
       'Larger packs are easier for general trade to stock, because they take less shelf space',
       'Larger packs attract a lower GST rate, which lifts the brand’s realisation'],
 why:'The deck pairs <b>Profitability</b> with <b>Sales Growth</b>, and the mechanism for growth is <b>Share of Requirement (SOR)</b> — the proportion of a household’s category consumption that goes to your brand. A 1 L pack covers, say, eight weeks of use; a 200 ml pack covers two. Over a twelve-month timeline, the small-pack household reaches a purchase decision six times more often, and each of those is a chance to be switched away. <b>Locking consumers in for longer increases share.</b><br><br>It is worth seeing that this is a share argument, not a volume-per-trip argument: the same consumption is being defended, not created.'},

{t:'pack',tag:'apply',diff:'easy',
 q:'A shopper realises twenty minutes before friends arrive that she has no snacks, and buys whatever the nearest store has. Which of the deck’s four <b>shopper missions</b> is this?',
 opts:['Just in Time','Routine Purchase','Experiential','Research'],
 why:'The deck’s four missions, each with its example:<div class="work">Routine Purchase  the monthly shop, with a list\nJust in Time      snacks for an impromptu party\nExperiential      treating yourself to apparel for\n                  an upcoming event\nResearch          buying a new phone</div>The mission is what decides the pack. A <b>Just in Time</b> trip wants a small, immediately consumable pack in the nearest store — sachets and single-serves in general trade, and price is a secondary concern because availability is the binding constraint. The <b>Routine</b> shopper on the same category buys the 1 L value pack in modern trade. Same consumer, same brand, different pack — which is precisely why the deck insists on <b>shopper-backward thinking</b> on pack sizes.'},

{t:'pack',tag:'apply',diff:'medium',
 q:'The deck draws <b>recruit</b> and <b>uptrade</b> arrows across a pack-size ladder. What is the role of each end?',
 opts:['Small packs recruit new consumers at a low cash outlay; larger packs uptrade them once they are in — and a brand needs both',
       'Small packs uptrade existing loyalists; large packs recruit new consumers by looking like better value',
       'Only the largest pack matters, since it carries the highest margin — the small packs should be discontinued',
       'Recruit and uptrade are two names for the same move: getting a shopper into a bigger pack'],
 why:'<b>Recruit</b> at the bottom: a small pack is a low-risk, low-cash-outlay trial for someone who has never bought you. <b>Uptrade</b> upward: once she is in, move her up the ladder, where SOR and margin both improve. The deck’s diagram deliberately marks recruit at more than one rung — you recruit into the mid pack too, from a different set of consumers.<br><br>The “discontinue the small packs” answer is the live temptation and the deck rules it out: <b>a brand needs to recruit across pack sizes as well as uptrade.</b> Kill the entry rung and margin per pack looks better while the funnel that feeds the ladder quietly dries up.'},

{t:'pack',tag:'apply',diff:'medium',trap:true,
 q:'A brand adds a cheap small pack, priced attractively <i>per ml</i>, hoping to recruit new users. The deck flags a specific risk. Which one?',
 opts:['Active downgradation from self — your own larger-pack buyers move down the ladder, so volume re-buckets into a lower-value pack instead of new users coming in',
       'The pack will necessarily be loss-making, because packaging cost per ml is higher on small packs',
       'Modern trade will refuse to list it, because it takes shelf space from the large pack',
       'It breaches the price ladder, which is prohibited under Indian packaging regulation'],
 why:'The deck’s warning slide carries two lines: <b>scan for competition — you are not operating in isolation</b>, and <b>reducing pack sizes can lead to active downgradation from self</b>. Recruitment only pays if the small pack brings in people who were not buying you. If it mostly re-buckets your existing buyers, you have cut realisation per consumer <i>and</i> shortened their purchase cycle, losing on both margin and SOR.<br><br>Notice what the price ladder is doing here — it is the guardrail. A correctly laddered small pack is the <b>most expensive per ml</b>, and that premium is what stops a large-pack buyer from stepping down. Pricing the small pack attractively per ml inverts the ladder and removes the guardrail, which is exactly how downgradation gets invited in. It is a commercial mistake, not a legal one, and packaging cost per ml being higher on small packs is true but does not make them loss-making — it is why they carry the higher per-ml price.'},

{t:'pack',tag:'concept',diff:'medium',
 q:'The deck says every pack decision has to balance three sets of objectives. Whose?',
 opts:['The brand’s, the shopper’s and the channel’s',
       'The brand’s, the manufacturer’s and the regulator’s',
       'The shopper’s, the competitor’s and the investor’s',
       'Marketing’s, finance’s and supply chain’s'],
 why:'<b>Brand objective</b> — recruit, uptrade, protect RPI. <b>Shopper objective</b> — the pack that fits her mission and her cash outlay. <b>Channel objective</b> — what the retailer needs to stock and sell it. The three pull in different directions, and the two decisions you actually make — <b>pack format</b> and <b>pack quantity–price</b> — are where the trade-off gets resolved.<br><br>The channel leg is the one people drop, and the deck spells it out: packs are customised for <b>general trade</b>, <b>modern trade</b> and <b>eCommerce</b>. A sachet that works in a kirana is dead weight in an eCommerce basket where shipping economics push toward bulk; the multipack modern trade wants will not fit a general-trade counter.'},

   SOUND — synthesised with WebAudio, no files, no network.
   The context is created lazily on the first click, which satisfies autoplay.
   ========================================================================= */
let AC=null, SOUND=true;
try{ if(localStorage.getItem('mm2_sound')==='0') SOUND=false; }catch(e){}
function ac(){
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(AC.state==='suspended') AC.resume();
  return AC;
}
function tone(freq,at,dur,type,vol,glideTo){
  const c=ac(); if(!c) return;
  const t0=c.currentTime+at;
  const o=c.createOscillator(), g=c.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(freq,t0);
  if(glideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,glideTo),t0+dur);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol||0.18,t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0+dur+0.03);
}
function noise(at,dur,vol,freq){
  const c=ac(); if(!c) return;
  const t0=c.currentTime+at, n=Math.floor(c.sampleRate*dur);
  const buf=c.createBuffer(1,n,c.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const src=c.createBufferSource(); src.buffer=buf;
  const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=freq||900;
  const g=c.createGain(); g.gain.setValueAtTime(vol||0.2,t0);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  src.connect(f); f.connect(g); g.connect(c.destination);
  src.start(t0); src.stop(t0+dur+0.02);
}
/* correct — a major arpeggio that climbs higher the longer the streak runs */
function sfxRight(streak){
  if(!SOUND) return;
  const base=523.25*Math.pow(2,Math.min(4,Math.floor((streak-1)/4))/12*2);
  const notes=[1,1.26,1.5,2];                         // root, M3, P5, octave
  notes.forEach((m,i)=>tone(base*m,i*0.055,0.26,'triangle',0.17));
  if(streak>=3) tone(base*2.52,0.235,0.34,'sine',0.13);
  if(streak>=7){ tone(base*3,0.30,0.4,'sine',0.11); noise(0,0.16,0.09,2600); }
  if(streak>=12){ [0,.09,.18].forEach((t,i)=>tone(base*(3+i*0.5),0.34+t,0.3,'triangle',0.09)); }
}
/* wrong — a fat descending buzzer plus a thud */
function sfxWrong(){
  if(!SOUND) return;
  tone(196,0,0.42,'sawtooth',0.20,72);
  tone(146.8,0.03,0.46,'square',0.13,58);
  noise(0,0.28,0.26,420);
  tone(92,0.16,0.3,'sine',0.16,46);
}

let toastQ=[],toasting=false;
function toast(em,tt,td){toastQ.push([em,tt,td]);if(!toasting)nextToast();}
function nextToast(){if(!toastQ.length){toasting=false;return;}toasting=true;const[em,tt,td]=toastQ.shift();
  $('#toEm').textContent=em;$('#toTt').textContent=tt;$('#toTd').textContent=td;const t=$('#toast');
  t.classList.add('show');setTimeout(()=>{t.classList.remove('show');setTimeout(nextToast,380);},1900);}
function unlock(id){if(G.badges[id])return;const b=BADGES.find(x=>x.id===id);if(!b)return;G.badges[id]=1;
  G.xp+=50;toast(b.em,'Badge unlocked: '+b.name,'+50 XP · '+b.desc);sfxBadge();renderHUD();}

/* ---------- 🎆 crackers — intensity scales with the streak ---------- */
const CRK=['#22D3EE','#8B5CF6','#F472B6','#4ADE80','#FBBF24','#FB7185','#FFFFFF'];
function burstAt(x,y,n,spread,size){
  const ring=el('div','boom');ring.style.left=x+'px';ring.style.top=y+'px';
  const rs=spread*1.6;ring.style.width=rs+'px';ring.style.height=rs+'px';
  ring.style.borderColor=rnd(CRK);document.body.appendChild(ring);setTimeout(()=>ring.remove(),740);
  for(let i=0;i<n;i++){
    const ang=(i/n)*Math.PI*2+Math.random()*0.4;
    const r=spread*(0.5+Math.random()*0.75);
    const s=el('div','spark'),dot=el('i');s.appendChild(dot);
    s.style.left=x+'px';s.style.top=y+'px';
    const col=rnd(CRK),w=size*(0.6+Math.random()*0.9);
    dot.style.background=col;dot.style.boxShadow='0 0 10px '+col+',0 0 22px '+col;
    dot.style.width=w+'px';dot.style.height=w+'px';
    const d=0.8+Math.random()*0.6;
    s.style.setProperty('--tx',(Math.cos(ang)*r).toFixed(1)+'px');
    s.style.setProperty('--ty',(Math.sin(ang)*r).toFixed(1)+'px');
    s.style.setProperty('--d',d.toFixed(2)+'s');
    document.body.appendChild(s);setTimeout(()=>s.remove(),(d+0.4)*1000);
  }
}
function launchTo(x,y,n,spread,size){
  const rd=0.30+Math.random()*0.18;
  const rk=el('div','rocket');rk.style.left=x+'px';rk.style.top=innerHeight+'px';
  const col=rnd(CRK);rk.style.background=col;rk.style.boxShadow='0 0 12px '+col;
  rk.style.setProperty('--ry',(y-innerHeight)+'px');rk.style.setProperty('--rd',rd.toFixed(2)+'s');
  document.body.appendChild(rk);
  setTimeout(()=>{rk.remove();burstAt(x,y,n,spread,size);if(SOUND)noise(0,0.12,0.07,2200);},rd*1000);
}
function flash(){if(reduced)return;const f=el('div','flash');document.body.appendChild(f);setTimeout(()=>f.remove(),580);}
function greenFlash(streak){
  if(reduced)return;
  const g=el('div','greenflash');document.body.appendChild(g);setTimeout(()=>g.remove(),620);
  const v=el('div','vignette good');document.body.appendChild(v);setTimeout(()=>v.remove(),900);
  document.body.classList.add('zoomit');setTimeout(()=>document.body.classList.remove('zoomit'),520);
  if(streak>=7)flash();
}
/* tier 0: 2 shells · tier 1 (3+): 3 · tier 2 (7+): 5 + white flash
   tier 3 (12+): 8 shells, wider, plus a confetti barrage                    */
function crackers(x,y,streak){
  if(reduced)return;
  if(x==null||isNaN(x)){x=innerWidth/2;y=innerHeight/2;}
  const s=streak||1;
  const tier = s>=12?3 : s>=7?2 : s>=3?1 : 0;
  const shells=[2,3,5,8][tier];
  const grow=1.25+tier*0.32;
  burstAt(x,y,Math.round(20*grow),Math.round(120*grow),7+tier);
  const W=innerWidth,H=innerHeight;
  for(let i=0;i<shells;i++){
    const sx=W*(0.10+Math.random()*0.80), sy=H*(0.10+Math.random()*0.32);
    setTimeout(()=>launchTo(sx,sy,Math.round(26*grow),Math.round(150*grow),6+tier),70+i*130);
  }
  if(tier>=1)confetti(24*tier);
  if(tier>=3){
    confetti(90);
    setTimeout(()=>{for(let i=0;i<4;i++){const sx=W*(0.12+Math.random()*0.76),sy=H*(0.08+Math.random()*0.30);
      setTimeout(()=>launchTo(sx,sy,36,225,9),i*120);}},720);
  }
}
function confetti(count){if(reduced)return;const cols=['#22D3EE','#8B5CF6','#F472B6','#4ADE80','#FBBF24'];const n=count||100;
  for(let i=0;i<n;i++){const c=el('div','confetti');c.style.left=Math.random()*100+'vw';c.style.background=cols[i%cols.length];c.style.transform='rotate('+(Math.random()*360)+'deg)';
    const d=2.4+Math.random()*1.8;c.style.animation='fall '+d+'s linear '+(Math.random()*0.6)+'s forwards';document.body.appendChild(c);setTimeout(()=>c.remove(),(d+1)*1000);}}
const cst=document.createElement('style');cst.textContent='@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.2}}';document.head.appendChild(cst);

/* ---------- 👎 thumbs down — a full shower, always heavy ---------- */
function thumbsDown(x,y,lostStreak){
  if(reduced)return;
  if(x==null||isNaN(x)){x=innerWidth/2;y=innerHeight/2;}
  const rf=el('div','redflash');document.body.appendChild(rf);setTimeout(()=>rf.remove(),720);
  const vg=el('div','vignette');document.body.appendChild(vg);setTimeout(()=>vg.remove(),980);
  document.body.classList.add('shakeit');setTimeout(()=>document.body.classList.remove('shakeit'),500);
  /* the bigger the streak you just torched, the heavier the shower */
  const extra=Math.min(26,(lostStreak||0)*3);
  const popN=22+extra, rainN=20+extra;
  for(let i=0;i<popN;i++){                       // burst outward from the tapped option
    const t=el('div','tdown pop','👎');
    const ang=(i/popN)*Math.PI*2+Math.random()*0.5;
    const r=110+Math.random()*230;
    const d=1.0+Math.random()*0.8;
    t.style.left=x+'px';t.style.top=y+'px';
    t.style.fontSize=(24+Math.random()*38).toFixed(0)+'px';
    t.style.setProperty('--tx',(Math.cos(ang)*r).toFixed(1)+'px');
    t.style.setProperty('--ty',(Math.sin(ang)*r+150).toFixed(1)+'px');
    t.style.setProperty('--rot',((Math.random()-0.5)*720).toFixed(0)+'deg');
    t.style.setProperty('--d',d.toFixed(2)+'s');
    document.body.appendChild(t);setTimeout(()=>t.remove(),(d+0.3)*1000);
  }
  for(let i=0;i<rainN;i++){                      // and a shower down the whole screen
    const t=el('div','tdown rain','👎');
    const d=1.5+Math.random()*1.6;
    t.style.left=(Math.random()*96)+'vw';t.style.top='-50px';
    t.style.fontSize=(22+Math.random()*40).toFixed(0)+'px';
    t.style.setProperty('--ty',(innerHeight+150)+'px');
    t.style.setProperty('--rot',((Math.random()-0.5)*900).toFixed(0)+'deg');
    t.style.setProperty('--d',d.toFixed(2)+'s');
    t.style.animationDelay=(Math.random()*0.6).toFixed(2)+'s';
    document.body.appendChild(t);setTimeout(()=>t.remove(),(d+1.2)*1000);
  }
}

/* ---------- keyboard: answer the first unanswered question ---------- */
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(/^(INPUT|TEXTAREA)$/.test((e.target.tagName||'')))return;
  if($('#badgeOvl')||$('#cmapOvl'))return;
  const map={'1':0,'2':1,'3':2,'4':3,'a':0,'b':1,'c':2,'d':3};
  const idx=map[(e.key||'').toLowerCase()];
  if(idx===undefined)return;
  const box=[...document.querySelectorAll('.mcq')].find(b=>!b.dataset.done);
  if(!box)return;

/* ---------- MCQ ---------- */
function mcqNode(Q,card,onScore){
  const box=el('div','mcq');
  const tagLb={apply:'⚙ Apply',case:'🏷 Case',calc:'🧮 Calculate',concept:'◈ Concept'};
  let head='<span class="tag '+Q.tag+'">'+(tagLb[Q.tag]||'◈ Concept')+'</span>';
  if(Q.diff)head+='<span class="tag '+Q.diff+'">'+Q.diff+'</span>';
  if(Q.trap)head+='<span class="tag trap">🃏 tricky</span>';
  box.innerHTML=head+'<div class="q">'+Q.q+'</div>';
  if(Q.given)box.appendChild(el('div','givens',Q.given.map(g=>'<span>'+g+'</span>').join('')));
  const opts=el('div','opts');box.appendChild(opts);
  const letters=['A','B','C','D'],order=shuffle(Q.opts.map((o,i)=>({o,i})));let done=false;
  order.forEach((item,pos)=>{
    const b=el('button','opt','<span class="lt">'+letters[pos]+'</span>'+item.o);
    b.onclick=e=>{
      if(done)return;done=true;box.dataset.done='1';const ok=item.i===0;
      [...opts.children].forEach((c,j)=>{c.disabled=true;
        if(order[j].i===0)c.classList.add('correct');else if(j===pos)c.classList.add('wrong');else c.classList.add('dim');});
      onAnswer(ok,e.clientX,e.clientY,card);onScore&&onScore(ok);
      const why=el('div','why','<h5>'+(ok?'Why this is right →':'Why the answer is what it is →')+'</h5><p>'+Q.why+'</p>');
      box.appendChild(why);requestAnimationFrame(()=>why.classList.add('show'));
    };
    opts.appendChild(b);});
  return box;
}

  const bk=el('button','btn btn-grad','← Back to the quiz');
  const close=()=>ovl.remove();
  bk.onclick=close;row.appendChild(bk);card.appendChild(row);
  const x=el('button','x','×');x.onclick=close;
  ovl.appendChild(x);ovl.appendChild(card);
  ovl.onclick=e=>{if(e.target===ovl)close();};
  document.addEventListener('keydown',function esc(e){if(e.key==='Escape'){close();document.removeEventListener('keydown',esc);}});
  document.body.appendChild(ovl);
};

/* ---------- mix map (cheat-sheet) ---------- */
/* Opens over the quiz, like the badges panel, so an attempt in progress survives. */
$('#hMap').onclick=()=>{
  if($('#cmapOvl'))return;
  const ovl=el('div','ovl');ovl.id='cmapOvl';
  const card=el('div','card');
  card.innerHTML='<div class="eyebrow">Reference</div><h1 class="tt">The Mix Map 📋</h1>'+
    '<div class="sub">Sessions 8–12 on one page — the 6Ps with Surf excel filled in, the four levels of Product, the RPI formula, '+
    'the quality parameters, and every pack-price rule. <b>Bold</b> marks the bit that usually carries the mark.</div>';
  CMAP.forEach(b=>{
    const blk=el('div','cm-block');
    blk.innerHTML='<h4>'+b.h+'</h4><p class="cm-note">'+b.note+'</p>';
    const sc=el('div','cm-scroll');
    /* rows carry a variable number of cells; the last cell of a short row
       spans the remainder so the columns stay aligned down the block */
    const cells=b.rows.map(r=>r.filter(c=>c!=='')), cols=Math.max(...cells.map(r=>r.length));
    sc.innerHTML='<table><tbody>'+cells.map(r=>
      '<tr>'+r.map((c,i)=>{
        const span=(i===r.length-1&&r.length<cols)?' colspan="'+(cols-i)+'"':'';
        return '<td'+span+'>'+c+'</td>';
      }).join('')+'</tr>').join('')+'</tbody></table>';
    blk.appendChild(sc);card.appendChild(blk);
  });
  const row=el('div','row-btns');
  const bk=el('button','btn btn-grad','← Back to the quiz');
  const close=()=>ovl.remove();
  bk.onclick=close;row.appendChild(bk);card.appendChild(row);
  const x=el('button','x','×');x.onclick=close;
  ovl.appendChild(x);ovl.appendChild(card);
  ovl.onclick=e=>{if(e.target===ovl)close();};
  document.addEventListener('keydown',function esc(e){if(e.key==='Escape'){close();document.removeEventListener('keydown',esc);}});
  document.body.appendChild(ovl);
};

renderHUD();renderQuiz();
